<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algebra Ascent — Zero → Hero · TM Bhinder Maths Lab</title>
<meta name="description" content="Climb from zero to algebra hero through 13 interactive simulations. No accounts. Progress stays on your device.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1B2340;--deep:#131a30;--surf:#242D52;--surf2:#2E3968;--line:#3a4678;
  --teal:#19C2B8;--gold:#FFB020;--green:#46D46A;--red:#FF4D5E;--blue:#3D8BFF;--mag:#E85BD0;
  --paper:#FFF6E8;--ink:#2a2418;--mist:#EDF2FF;--dim:#9aa7cf;
  --disp:"Fraunces",Georgia,serif;--ui:"Inter",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --nav:64px;--rad:14px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--deep);color:var(--mist);font-family:var(--ui);font-size:15px;line-height:1.5;padding-top:var(--nav);min-height:100vh;overflow-x:hidden}
body.hc{--dim:#c8d2f5;--line:#5f6ea8}
body.nomo *{transition:none!important;animation:none!important}
#sky{position:fixed;inset:0;z-index:-2;width:100%;height:100%}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--deep)}
::-webkit-scrollbar-thumb{background:var(--surf2);border-radius:8px;border:2px solid var(--deep)}
::-webkit-scrollbar-thumb:hover{background:var(--teal)}
*{scrollbar-color:var(--surf2) var(--deep);scrollbar-width:thin}
a{color:var(--blue);text-decoration:none}
button{font-family:var(--ui);cursor:pointer}
input,select{font-family:var(--ui)}
.mono{font-family:var(--mono)}
#errbar{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#3a1420;border:1px solid var(--red);color:#ffd7dc;border-radius:12px;padding:12px 16px;font-size:13px;font-family:var(--mono)}
#nav{position:fixed;top:0;left:0;right:0;height:var(--nav);z-index:50;display:flex;align-items:center;gap:18px;padding:0 18px;background:rgba(19,26,48,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#nav .logo{font-family:var(--disp);font-weight:800;font-size:19px;color:var(--mist);letter-spacing:.5px;white-space:nowrap}
#nav .logo b{color:var(--teal)}
#nav .links{display:flex;gap:4px}
#nav .links a{color:var(--dim);font-weight:600;font-size:13.5px;padding:8px 11px;border-radius:9px}
#nav .links a:hover{color:var(--mist);background:var(--surf)}
#nav .links a.on{color:var(--teal);background:rgba(25,194,184,.12)}
#nav .sp{flex:1}
.xpchip{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:800;color:var(--gold);white-space:nowrap}
.xpbar{width:74px;height:6px;background:var(--deep);border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--mag));border-radius:4px;transition:width .5s}
.streak{font-weight:800;font-size:13px;color:var(--mag);white-space:nowrap}
.icobtn{background:var(--surf);border:1px solid var(--line);color:var(--mist);width:38px;height:38px;border-radius:10px;font-size:16px;display:grid;place-items:center;flex:none}
.icobtn:hover{border-color:var(--teal)}
#tabbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(19,26,48,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
#tabbar a{flex:1;text-align:center;color:var(--dim);font-size:11px;font-weight:700;padding:6px 2px;border-radius:10px}
#tabbar a.on{color:var(--teal);background:rgba(25,194,184,.12)}
#tabbar a span{display:block;font-size:19px}
#view{max-width:1180px;margin:0 auto;padding:26px 20px 90px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);padding:20px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#08251f;border:none;font-weight:800;font-size:14px;padding:11px 20px;border-radius:11px;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(25,194,184,.35)}
.btn.gold{background:var(--gold);color:#3a2400}
.btn.ghost{background:var(--surf2);color:var(--mist);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
.chip.ok{color:var(--green);border-color:rgba(70,212,106,.4);background:rgba(70,212,106,.08)}
.chip.gold{color:var(--gold);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.08)}
.paper{background:var(--paper);color:var(--ink);border-radius:var(--rad);padding:22px 24px;box-shadow:0 10px 34px rgba(0,0,0,.35);border:1px solid #e8d9bd}
.paper h3{font-family:var(--disp);font-size:21px;margin-bottom:8px}
.paper .ex{font-family:var(--mono);background:#f3e6cc;border:1px dashed #c9b183;border-radius:9px;padding:9px 13px;margin-top:12px;font-size:14px;font-weight:800;color:#5a4318}
h1.big{font-family:var(--disp);font-weight:800;font-size:clamp(34px,6vw,58px);line-height:1.04;letter-spacing:.5px}
h2.sec{font-family:var(--disp);font-weight:800;font-size:26px;margin-bottom:14px}
.sub{color:var(--dim);font-size:14px}
.hero{position:relative;padding:34px 0 26px;overflow:hidden}
.hero .kicker{color:var(--gold);font-weight:800;letter-spacing:3px;font-size:12px}
.hero h1 span{color:var(--teal)}
.hero .cta{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.mtn{position:absolute;right:-30px;bottom:-8px;width:min(46vw,430px);opacity:.9;pointer-events:none}
.supply{border:1px solid rgba(255,176,32,.5);background:linear-gradient(120deg,rgba(255,176,32,.12),rgba(232,91,208,.10));border-radius:var(--rad);padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0 22px}
.spine{position:relative;margin-top:10px}
.spine::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:3px;background:repeating-linear-gradient(180deg,var(--line) 0 8px,transparent 8px 16px);border-radius:2px}
.wrow{position:relative;display:flex;gap:18px;margin-bottom:16px;align-items:stretch}
.wnode{flex:0 0 56px;display:flex;align-items:flex-start;justify-content:center;padding-top:22px;z-index:1}
.wnode i{width:20px;height:20px;border-radius:50%;background:var(--surf2);border:3px solid var(--line);display:block}
.wrow.open .wnode i{border-color:var(--teal);background:var(--teal);box-shadow:0 0 16px rgba(25,194,184,.7)}
.wrow.clear .wnode i{border-color:var(--gold);background:var(--gold);box-shadow:0 0 14px rgba(255,176,32,.6)}
.wcard{flex:1;display:flex;gap:16px;align-items:center;flex-wrap:wrap;transition:transform .15s,border-color .15s}
.wcard:hover{transform:translateX(4px);border-color:var(--teal)}
.wrow.locked .wcard{opacity:.55;filter:saturate(.5)}
.wcard .em{font-size:34px;width:56px;height:56px;display:grid;place-items:center;background:var(--surf2);border-radius:12px;flex:none}
.wcard .tt{flex:1;min-width:200px}
.wcard .tt h3{font-family:var(--disp);font-size:20px}
.wcard .tt .sub{font-size:12.5px}
.pbar{height:7px;background:var(--deep);border-radius:5px;overflow:hidden;margin-top:8px;max-width:260px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width .5s}
.cal{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.cal i{width:16px;height:16px;border-radius:5px;background:var(--surf2);border:1px solid var(--line)}
.cal i.hit{background:var(--mag);border-color:var(--mag);box-shadow:0 0 8px rgba(232,91,208,.5)}
.crumb{font-size:13px;color:var(--dim);margin-bottom:14px;display:inline-block}
.crumb:hover{color:var(--teal)}
.whead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.whead .em{font-size:52px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lcard{display:flex;flex-direction:column;gap:10px}
.lcard h3{font-size:16.5px;font-family:var(--disp)}
.lcard .row{display:flex;gap:8px;flex-wrap:wrap}
.bosscard{margin-top:18px;border:1px solid rgba(255,176,32,.45);background:linear-gradient(120deg,rgba(255,176,32,.10),rgba(255,77,94,.08))}
.hearts{font-size:20px;letter-spacing:3px;color:var(--red)}
.hearts .off{opacity:.22;filter:grayscale(1)}
.lessoncols{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
.actcard{display:flex;flex-direction:column;gap:10px}
.actcard .big-em{font-size:38px}
.simwrap{display:flex;flex-direction:column;gap:12px}
.mission{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);padding:12px 16px}
.mission .mt{font-weight:800;font-size:13.5px;color:var(--gold);white-space:nowrap}
.goal{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;font-weight:600;color:var(--dim);background:var(--surf2);border:1px solid var(--line);padding:5px 11px;border-radius:20px}
.goal.done{color:var(--green);border-color:rgba(70,212,106,.5);background:rgba(70,212,106,.1)}
.goal b{font-family:var(--mono)}
.simgrid{display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start}
.stage{background:linear-gradient(160deg,#20294c,#1a2140);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;touch-action:none}
.rail{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);padding:14px;display:flex;flex-direction:column;gap:11px;max-height:660px;overflow-y:auto}
.rail h4{font-size:11px;letter-spacing:2.5px;color:var(--teal);font-weight:800}
.ctl{display:flex;flex-direction:column;gap:5px}
.ctl label{font-size:12px;font-weight:700;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.ctl label output{color:var(--mist);font-family:var(--mono);font-weight:800}
.ctl input[type=range]{-webkit-appearance:none;appearance:none;height:7px;border-radius:5px;background:var(--deep);outline:none}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:var(--teal);border:3px solid #0b3a36;box-shadow:0 0 10px rgba(25,194,184,.6);cursor:pointer}
.ctl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--teal);border:3px solid #0b3a36;cursor:pointer}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surf2);color:var(--teal);font-size:17px;font-weight:800;flex:none}
.stepper button:hover{border-color:var(--teal)}
.stepper output{flex:1;text-align:center;font-family:var(--mono);font-weight:800;font-size:15px;background:var(--deep);border-radius:8px;padding:5px}
.ctl select{background:var(--deep);color:var(--mist);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:13px;font-weight:600;width:100%}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tgl span{font-size:12.5px;font-weight:700;color:var(--dim)}
.sw{width:46px;height:25px;border-radius:15px;background:var(--deep);border:1px solid var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--dim);transition:left .2s,background .2s}
.sw.on{background:rgba(25,194,184,.3);border-color:var(--teal)}
.sw.on::after{left:22px;background:var(--teal)}
.rail .uni{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:11px}
.mini-input{display:flex;gap:6px}
.mini-input input{flex:1;min-width:0;background:var(--deep);border:1px solid var(--line);color:var(--mist);border-radius:9px;padding:8px;font-family:var(--mono);font-size:14px}
.dock{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);padding:13px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dock .fb{flex:1;min-width:220px;font-size:14px;font-weight:600}
.dock .fb.good{color:var(--green)}.dock .fb.bad{color:var(--red)}.dock .fb.info{color:var(--blue)}
.dock .log{font-family:var(--mono);font-size:12px;color:var(--dim);width:100%;border-top:1px dashed var(--line);padding-top:8px;display:none;overflow-x:auto}
.dock .log.show{display:block}
.dock .acts{display:flex;gap:8px;flex-wrap:wrap}
.mdone{width:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(70,212,106,.12);border:1px solid rgba(70,212,106,.5);border-radius:10px;padding:9px 13px;font-weight:800;color:var(--green);font-size:13.5px}
.runhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.dots{display:flex;gap:6px;flex:1;min-width:120px}
.dots i{width:22px;height:8px;border-radius:5px;background:var(--surf2)}
.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}.dots i.cur{background:var(--gold);box-shadow:0 0 8px rgba(255,176,32,.6)}
.qcard{max-width:720px;margin:0 auto}
.qprompt{font-size:19px;font-weight:600;margin-bottom:18px;line-height:1.55}
.qprompt .mono{font-size:21px;color:var(--gold);font-weight:800}
.qprompt table{border-collapse:collapse;margin:10px 0;font-family:var(--mono)}
.qprompt td,.qprompt th{border:1px solid var(--line);padding:6px 16px;text-align:center}
.ansrow{display:flex;gap:10px;margin:14px 0}
.ansrow input{flex:1;min-width:0;background:var(--deep);border:2px solid var(--line);color:var(--mist);border-radius:12px;padding:13px 16px;font-family:var(--mono);font-size:20px;font-weight:800;outline:none}
.ansrow input:focus{border-color:var(--teal)}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;max-width:430px;margin-bottom:12px}
.keypad button{background:var(--surf2);border:1px solid var(--line);color:var(--mist);font-family:var(--mono);font-size:17px;font-weight:800;padding:11px 0;border-radius:10px}
.keypad button:hover{border-color:var(--teal);color:var(--teal)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{background:var(--surf2);border:2px solid var(--line);color:var(--mist);border-radius:12px;padding:14px;font-size:16px;font-weight:700;font-family:var(--mono);text-align:center;transition:border-color .12s,transform .12s}
.choices button:hover{border-color:var(--teal);transform:translateY(-2px)}
.choices button.pick-ok{border-color:var(--green);background:rgba(70,212,106,.15)}
.choices button.pick-no{border-color:var(--red);background:rgba(255,77,94,.15)}
.choices button svg{width:100%;height:auto;display:block}
.stepcard{border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin-bottom:10px;background:var(--surf2)}
.stepcard.done{border-color:rgba(70,212,106,.5)}
.stepcard.fail{border-color:rgba(255,77,94,.5)}
.stepcard .sl{font-size:13px;color:var(--dim);font-weight:700;margin-bottom:6px}
.stepcard .sv{font-family:var(--mono);font-size:18px;font-weight:800;color:var(--green)}
.feedback{border-radius:12px;padding:14px 17px;margin-top:14px;font-weight:600;display:none}
.feedback.show{display:block}
.feedback.ok{background:rgba(70,212,106,.13);border:1px solid rgba(70,212,106,.5);color:var(--green)}
.feedback.no{background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.5);color:#ffb3ba}
.feedback .ex{font-family:var(--mono);font-size:13.5px;margin-top:6px;color:var(--mist)}
.hintbox{background:rgba(61,139,255,.1);border:1px solid rgba(61,139,255,.4);border-radius:11px;padding:11px 15px;margin-top:12px;font-size:13.5px;color:#bcd6ff;display:none}
.hintbox.show{display:block}
.qfoot{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.summary{text-align:center;padding:36px 20px}
.summary .big-em{font-size:64px}
.summary h2{font-family:var(--disp);font-size:32px;margin:10px 0}
.statrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.stat{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:12px 22px;min-width:110px}
.stat b{display:block;font-size:24px;font-family:var(--mono);color:var(--gold)}
.stat span{font-size:11.5px;color:var(--dim);font-weight:700;letter-spacing:1px}
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.labcard{display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.labcard:hover{transform:translateY(-4px);border-color:var(--teal)}
.labcard .em{font-size:34px}
.labcard.locked{opacity:.5}
.tgrid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
.badge .em{font-size:30px}
.badge h5{font-size:12.5px;margin-top:6px}
.badge p{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.35}
.badge.got{border-color:rgba(255,176,32,.55);background:linear-gradient(150deg,rgba(255,176,32,.13),rgba(232,91,208,.08));box-shadow:0 0 18px rgba(255,176,32,.12)}
.badge:not(.got){opacity:.45;filter:grayscale(.7)}
details.g{background:var(--surf);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
details.g summary{cursor:pointer;padding:15px 18px;font-weight:800;font-size:15px;list-style:none;display:flex;gap:10px;align-items:center}
details.g summary::-webkit-details-marker{display:none}
details.g summary::before{content:"▸";color:var(--teal);transition:transform .2s}
details.g[open] summary::before{transform:rotate(90deg)}
details.g .gb{padding:0 18px 16px;color:var(--dim);font-size:14px}
details.g .gb .ex{font-family:var(--mono);background:var(--deep);border-radius:8px;padding:8px 12px;margin-top:8px;color:var(--gold);font-size:13.5px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow .st b{display:block;font-size:14.5px}
.setrow .st span{font-size:12.5px;color:var(--dim)}
#toasts{position:fixed;top:calc(var(--nav) + 12px);right:14px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:320px}
.toast{background:var(--surf2);border:1px solid var(--teal);border-radius:12px;padding:11px 16px;font-size:13px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .3s ease}
.toast.gold{border-color:var(--gold);color:var(--gold)}
.toast.xp{border-color:var(--line);color:var(--gold);font-family:var(--mono)}
@keyframes tin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;z-index:85;display:none;place-items:center;background:rgba(10,14,28,.72);backdrop-filter:blur(4px)}
#modal.show{display:grid}
#modal .mbox{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:430px;width:calc(100% - 40px)}
#modal h3{font-family:var(--disp);margin-bottom:10px}
#modal .macts{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media(max-width:960px){.simgrid{grid-template-columns:1fr}.rail{max-height:none}.lessoncols,.tgrid{grid-template-columns:1fr}}
@media(max-width:760px){
  #nav .links{display:none}
  #nav{gap:10px;padding:0 12px}
  #tabbar{display:flex}

/* ---------- sky ---------- */
var SKY={cv:qs("#sky"),alt:0,target:0.06,stars:[],snow:[],t:0,w:1,h:1,
zones:[[0,["#3a2c52","#7a4a3a","#FFB020"]],[0.25,["#1f3a5c","#2a6a7a","#19C2B8"]],[0.55,["#141c3a","#1B2340","#2E3968"]],[0.8,["#0e1230","#1B2340","#3a2a5c"]],[1,["#0a0e26","#141a3a","#2a1e4c"]]],

      var f=this.snow[i];

}};

var FX={cv:qs("#fx"),parts:[],running:false,
burst:function(x,y,n){
  var cols=["#19C2B8","#FFB020","#E85BD0","#46D46A","#3D8BFF","#FF4D5E"];

  var g=this.cv.getContext("2d"),self=this,last=performance.now();
  var loop=function(t){
    var dt=Math.min(0.04,(t-last)/1000);last=t;
    g.clearRect(0,0,self.cv.width,self.cv.height);
    self.parts=self.parts.filter(function(p){return p.life>0;});
    self.parts.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.life-=dt*0.9;p.r+=0.1;

  };

}};

function nI(prompt,answer,explain,hints){return{type:"num",prompt:prompt,answer:answer,explain:explain,hints:hints};}
function cI(prompt,choices,correct,explain,hints,r){
  var order=shuffle(r,choices.map(function(c,i){return i;}));
  return{type:"choice",prompt:prompt,choices:order.map(function(i){return choices[i];}),answer:order.indexOf(correct),explain:explain,hints:hints};
}

GEN["int-add"]=function(r){var a=ri(r,-9,9),b=ri(r,-9,9),ans=a+b;
return nI(M(a+" + ("+b+")"),ans,M(a+" + ("+b+") = "+ans),H3("Start at "+M(a)+" on the number line.","Adding "+M(b)+" means hop "+Math.abs(b)+" "+(b>=0?"right":"left")+".","Landing: "+M(ans)+"."));};
GEN["int-sub"]=function(r){var a=ri(r,-9,9),b=ri(r,-9,9),ans=a-b;
return nI(M(a+" − ("+b+")"),ans,M(a+" − ("+b+") = "+a+" + "+M(-b)+" = "+ans),H3("Subtracting is adding the opposite.","Rewrite as "+M(a)+" + "+M(-b)+".","Hop "+Math.abs(b)+" "+(b>=0?"left":"right")+" from "+M(a)+" → "+M(ans)+"."));};
GEN.pemdas=function(r){var a=ri(r,2,9),b=ri(r,2,6),c=ri(r,1,9),br=r()<0.5;
var expr=br?"("+a+" + "+c+") × "+b:a+" + "+c+" × "+b;
var ans=br?(a+c)*b:a+c*b;
var first=br?"("+a+" + "+c+") = "+(a+c):c+" × "+b+" = "+(c*b);
var second=br?(a+c)+" × "+b+" = "+ans:a+" + "+(c*b)+" = "+ans;
return nI(M(expr),ans,M(expr)+" = "+ans,H3("Brackets first, then × ÷, then + −.","First: "+first+".","Then: "+second+"."));};
GEN.evaluate=function(r){var a=ri(r,2,6),b=ri(r,-6,9),x=ri(r,-4,6),ans=a*x+b;
var e=poly(a,b);
return nI("If x = "+M(x)+", what is "+e+"?",ans,M(a+"("+x+")"+pm(b)+" = "+ans),H3("Replace every x with "+M(x)+".","Multiply first: "+a+" × "+M(x)+" = "+M(a*x)+".","Then "+M(a*x)+pm(b)+" = "+M(ans)+"."));};
GEN.rules=function(r){var a=ri(r,2,5),b=ri(r,-4,6);
var rows=[1,2,3].map(function(x){return "<tr><td>"+x+"</td><td>"+M(a*x+b)+"</td></tr>";}).join("");
var rule="y = "+poly(a,b);
var opts=[rule,"y = "+poly(a+1,b),"y = "+poly(a,b+1),"y = "+poly(b,a)];
return cI("Which rule fits this table?<table><tr><th>x</th><th>y</th></tr>"+rows+"</table>",opts,0,rule+" fits every row.",H3("How much does y change when x grows by 1?","That change is "+a+" — the multiplier.","Check x = 1: "+M(a+b)+" ✓"),r);};
GEN.translate=function(r){var n=ri(r,2,9),m=ri(r,2,6);
var T=[["a number increased by "+n,"x + "+n,["x − "+n,n+" − x",n+"x"]],
[n+" less than a number","x − "+n,[n+" − x","x + "+n,"−"+n+"x"]],
["the product of "+m+" and a number",m+"x",[m+" + x","x/"+m,"x − "+m]],
["a number divided by "+m,"x/"+m,[m+"/x",m+"x","x − "+m]],
[n+" more than twice a number","2x + "+n,["2(x + "+n+")","2x − "+n,n+"x + 2"]],
["twice the sum of a number and "+n,"2(x + "+n+")",["2x + "+n,"x + "+(2*n),"2x − "+n]]];
var t=pick(r,T);
return cI("Translate: “"+t[0]+"”",[t[1]].concat(t[2]),0,t[0]+" → "+t[1],H3("Let the unknown number be x.","'Less than' reverses order; 'product' means ×.","The expression is "+t[1]+"."),r);};
GEN.parts=function(r){var a=ri(r,2,9),b=ri(r,1,9),kind=pick(r,["coefficient","constant","variable"]);
var ans=kind==="coefficient"?String(a):kind==="constant"?String(b):"x";
var pool=[String(a),String(b),"x",a+"x",String(a+b)];
var opts=[ans];
pool.forEach(function(p){if(opts.length<4&&opts.indexOf(p)<0)opts.push(p);});
return cI("In "+poly(a,b)+", what is the "+kind+"?",opts,0,"The "+kind+" is "+M(ans)+".",H3("Coefficient = the number multiplying x.","Constant = the number standing alone.","Variable = the letter."),r);};
GEN.tiles=function(r){var cx=ri(r,-3,4)||2,cu=ri(r,-4,5);
var expr=poly(cx,cu);
var opts=[expr,poly(cx+1,cu),poly(cx,-cu),poly(-cx,cu)];

SIMS.factory=function(scope,api){

    var r=mulberry((Date.now()^Math.floor(Math.random()*1e9))>>>0),n=P.terms,nums=[],ops=[],i;
    for(i=0;i<n;i++)nums.push(P.neg&&r()<0.35?-ri(r,1,9):ri(r,1,9));
    for(i=0;i<n-1;i++)ops.push(pick(r,P.div?["+","−","×","÷"]:["+","−","×"]));
    ops.forEach(function(op,i2){if(op==="÷"){var d=ri(r,1,6);nums[i2+1]=d;nums[i2]=d*ri(r,1,6);}});
    tokens=[];brO=-1;brC=-1;
    var at=-1;
    if(P.brackets&&n>=3)at=r()<0.5?0:n-2;
    for(i=0;i<n;i++){
      if(i===at){tokens.push({t:"("});brO=tokens.length-1;}
      tokens.push({t:"n",v:nums[i]});
      if(at>=0&&i===at+1){tokens.push({t:")"});brC=tokens.length-1;}
      if(i<n-1)tokens.push({t:"o",op:ops[i]});

    for(var i=1;i<tokens.length-1;i++){

    tokens.forEach(function(t,i2){
      var x=x0+i2*w+w/2;
      if(t.t==="n"){
        svg.append(s("rect",{x:x-w/2+6,y:222,width:w-12,height:76,rx:12,fill:"#242D52",stroke:"#3D8BFF","stroke-width":2}));
        stxt(x,270,M(t.v),{"text-anchor":"middle","font-size":26,"font-weight":800},svg);
      } else if(t.t==="("||t.t===")"){

        g.append(stxt(x,270,t.op,{"text-anchor":"middle","font-size":26,"font-weight":800,fill:isReady?(hint?"#08251f":"#EDF2FF"):"#5a68a0","pointer-events":"none"}));
        g.addEventListener("click",function(){
          if(!isReady){api.feedback("Not ready — both neighbours must be values, and inner brackets resolve first.","bad");AU.play("bad");return;}
          if(opCls!==cls){
            api.emit("jam");AU.play("bad");
            api.feedback("JAM! "+t.op+" fired too early — "+(cls===2?"× and ÷ come before + and −.":"work left to right within the same class."),"bad");
            tween(scope,400,function(k){svg.style.transform="translateX("+Math.sin(k*28)*6*(1-k)+"px)";},function(){svg.style.transform="";});
            return;

          apply(i2);api.emit("op-correct");AU.play("good");
          api.feedback("Correct order ✓ the belt advances.","good");
          if(tokens.length===1){
            api.emit("solved");
            api.feedback("Expression fully evaluated = "+M(tokens[0].v)+" 🏭","good");
            confetti();
            scope.timeout(function(){gen();draw();},1500);
          }
          draw();
        });
        svg.append(g);
      }
    });
    stxt(400,420,tokens.length===1?("value: "+M(tokens[0].v)):"click an operation circle to collapse it",{"text-anchor":"middle","font-size":18,fill:"#FFB020","font-weight":800},svg);
  }
  gen();
  var controls=[
    {t:"select",label:"Numbers in expression",options:[[3,"3"],[4,"4"],[5,"5"]],get:function(){return P.terms;},set:function(v){P.terms=Number(v);gen();}},
    {t:"toggle",label:"Brackets",get:function(){return P.brackets;},set:function(v){P.brackets=v;gen();}},
    {t:"toggle",label:"Negative numbers",get:function(){return P.neg;},set:function(v){P.neg=v;gen();}},
    {t:"toggle",label:"Include ÷",get:function(){return P.div;},set:function(v){P.div=v;gen();}},
    {t:"range",label:"Belt speed (visual)",min:0.5,max:2,step:0.25,get:function(){return P.speed;},set:function(v){P.speed=v;},fmt:function(v){return v+"×";}},
    {t:"toggle",label:"Highlight valid class",get:function(){return P.hints;},set:function(v){P.hints=v;}},
    {t:"button",label:"⚄ New expression",fn:function(){gen();}}];
  return{stage:svg,controls:controls,update:draw,
    reset:function(){P.terms=3;P.brackets=true;P.neg=false;P.div=false;gen();},
    new:function(){gen();api.feedback("New expression on the belt.","info");}};
};
/* machine */
SIMS.machine=function(scope,api){
  var P={family:"ax+b",input:3,ga:3,gb:2,speed:1,table:true,reveal:false};
  var rule={a:3,b:2},feeds=[],predicted=null;
  var svg=baseSVG();
  var staticG=s("g",{}),gearG=s("g",{}),dyn=s("g",{});
  svg.append(staticG,gearG,dyn);
  var gears=[];
  function buildGears(){
    gearG.innerHTML="";gears=[];
    for(var i=0;i<2;i++){
      var g=s("g",{});
      for(var k=0;k<8;k++)g.append(s("rect",{x:-4,y:-30,width:8,height:12,rx:2,fill:"#3D8BFF",transform:"rotate("+(k/8*360)+")"}));
      g.append(s("circle",{cx:0,cy:0,r:22,fill:"#2E3968",stroke:"#3D8BFF","stroke-width":3}),s("circle",{cx:0,cy:0,r:7,fill:"#19C2B8"}));
      gearG.append(g);gears.push({el:g,x:350+i*100,y:230,dir:i?-1:1});
    }
  }
  buildGears();
  var ang=0;
  scope.raf(function(){
    if(!ST.settings.motion)return;
    ang+=0.6*P.speed;
    gears.forEach(function(g){g.el.setAttribute("transform","translate("+g.x+","+g.y+") rotate("+(ang*g.dir)+")");});
  });
  function newRule(){
    var r=mulberry((Date.now()^7)>>>0);
    rule.a=P.family==="x+b"?1:ri(r,1,6);
    rule.b=P.family==="ax"?0:(P.family==="ax-b"?-ri(r,1,9):(P.family==="x+b"?ri(r,1,9):ri(r,-9,9)));
    feeds=[];
  }
  newRule();
  function out(x){return rule.a*x+rule.b;}
  function update(){
    staticG.innerHTML="";dyn.innerHTML="";
    stxt(400,52,"FUNCTION MACHINE",{"text-anchor":"middle","font-size":15,fill:"#19C2B8","font-weight":800,"letter-spacing":4},staticG);
    staticG.append(s("rect",{x:280,y:140,width:240,height:180,rx:20,fill:"#242D52",stroke:"#19C2B8","stroke-width":3}),
      s("path",{d:"M330 140 L310 90 L490 90 L470 140",fill:"#2E3968",stroke:"#3a4678","stroke-width":2}),
      s("rect",{x:360,y:320,width:80,height:46,rx:9,fill:"#2E3968",stroke:"#3a4678","stroke-width":2}));
    stxt(400,120,"input: "+M(P.input),{"text-anchor":"middle","font-size":18,fill:"#FFB020","font-weight":800},staticG);
    var ruleTxt=P.reveal?("y = "+poly(rule.a,rule.b)):"y = ?x + ?";
    staticG.append(s("rect",{x:300,y:170,width:200,height:40,rx:9,fill:P.reveal?"rgba(255,176,32,.15)":"#131a30",stroke:P.reveal?"#FFB020":"#3a4678","stroke-width":2}));
    stxt(400,197,ruleTxt,{"text-anchor":"middle","font-size":17,"font-weight":800,fill:P.reveal?"#FFB020":"#9aa7cf"},staticG);
    stxt(150,180,"your guess:",{"text-anchor":"middle","font-size":13,fill:"#9aa7cf","font-weight":800},staticG);
    stxt(150,212,"y = "+poly(P.ga,P.gb),{"text-anchor":"middle","font-size":19,fill:"#E85BD0","font-weight":800},staticG);
    if(feeds.length){
      var last=feeds[feeds.length-1];
      stxt(400,404,"output: "+M(last.y),{"text-anchor":"middle","font-size":26,"font-weight":800,fill:"#46D46A"},dyn);
    }
    if(P.table&&feeds.length){
      stxt(620,150,"x → y",{"text-anchor":"middle","font-size":13,fill:"#9aa7cf","font-weight":800},dyn);
      feeds.slice(-6).forEach(function(f,i){stxt(620,176+i*24,M(f.x)+" → "+M(f.y),{"text-anchor":"middle","font-size":15},dyn);});
    }
    stxt(400,470,"feed inputs · watch the change per step · guess a and b",{"text-anchor":"middle","font-size":12.5,fill:"#3D8BFF"},dyn);
  }
  function feed(){
    var y=out(P.input);
    feeds.push({x:P.input,y:y});
    api.emit("feed");AU.play("feed");
    if(predicted!==null){
      if(near(predicted,y)){api.emit("predict-correct");api.feedback("Prediction "+M(predicted)+" ✓ — you read the machine!","good");confetti();}
      else api.feedback("Predicted "+M(predicted)+", got "+M(y)+". Study the table.","bad");
      predicted=null;
    } else api.feedback("Input "+M(P.input)+" → output "+M(y)+".","good");
    var ball=s("circle",{cx:400,cy:100,r:12,fill:"#FFB020"});
    svg.append(ball);
    tween(scope,700/P.speed,function(k){ball.setAttribute("cy",100+k*270);ball.setAttribute("opacity",k>0.85?(1-k)/0.15:1);},function(){ball.remove();});
    update();
  }
  function checkRule(){
    if(P.ga===rule.a&&P.gb===rule.b){
      api.emit("rule-guessed");P.reveal=true;
      api.feedback("Rule cracked: y = "+poly(rule.a,rule.b)+" 🎉","good");
      confetti();AU.play("goal");
    } else {api.feedback("Not yet — feed more inputs and watch how y changes per step.","bad");AU.play("bad");}
  }
  var controls=[
    {t:"select",label:"Rule family (new machine)",options:[["ax+b","ax + b"],["ax-b","ax − b"],["ax","ax only"],["x+b","x + b"]],get:function(){return P.family;},set:function(v){P.family=v;newRule();P.reveal=false;}},
    {t:"step",label:"Input x",min:-5,max:12,get:function(){return P.input;},set:function(v){P.input=v;}},
    {t:"range",label:"Guess: multiplier a",min:1,max:6,get:function(){return P.ga;},set:function(v){P.ga=v;}},
    {t:"range",label:"Guess: constant b",min:-9,max:9,get:function(){return P.gb;},set:function(v){P.gb=v;}},
    {t:"range",label:"Gear speed",min:0.5,max:2.5,step:0.25,get:function(){return P.speed;},set:function(v){P.speed=v;},fmt:function(v){return v+"×";}},
    {t:"toggle",label:"Show table",get:function(){return P.table;},set:function(v){P.table=v;}},
    {t:"toggle",label:"Reveal rule",get:function(){return P.reveal;},set:function(v){P.reveal=v;}},
    {t:"button",label:"✓ Check my rule",primary:true,fn:checkRule},
    {t:"input",label:"Predict output, then feed",ph:"prediction",btn:"Predict",fn:function(v){predicted=v;feed();}}];
  return{stage:svg,controls:controls,actions:[{label:"⚙ Feed input",primary:true,fn:feed}],update:update,
    reset:function(){P.input=3;P.ga=3;P.gb=2;P.reveal=false;feeds=[];},
    new:function(){newRule();P.reveal=false;api.feedback("A new hidden rule is loaded.","info");}};
};
/* translator */
SIMS.translator=function(scope,api,opts){
  var P={set:opts.set||"mixed",diff:1,hints:false,reveal:false,auto:true};
  var svg=baseSVG(),target=null,built=[],streak=0;
  var PHRASES=[["a number increased by {n}","x + {n}"],["{n} less than a number","x − {n}"],
  ["the product of {m} and a number","{m}x"],["a number divided by {m}","x/{m}"],
  ["{n} more than twice a number","2x + {n}"],["twice the sum of a number and {n}","2(x + {n})"],
  ["{n} subtracted from three times a number","3x − {n}"],["half a number plus {n}","x/2 + {n}"]];
  function gen(){
    var r=mulberry((Date.now()^3)>>>0);
    var pool=P.set==="addsub"?PHRASES.slice(0,2):(P.set==="muldiv"?PHRASES.slice(2,4):PHRASES);
    var p=pick(r,pool),n=ri(r,2,9),m=ri(r,2,6);
    target={phrase:p[0].replace("{n}",n).replace("{m}",m),expr:p[1].replace("{n}",n).replace("{m}",m)};
    built=[];
  }
  gen();
  function norm(x){return x.replace(/\s+/g,"").replace(/−/g,"-").replace(/×/g,"*");}
  function update(){
    svg.innerHTML="";
    stxt(400,52,"EXPRESSION TRANSLATOR",{"text-anchor":"middle","font-size":15,fill:"#19C2B8","font-weight":800,"letter-spacing":4},svg);
    svg.append(s("rect",{x:90,y:84,width:620,height:86,rx:12,fill:"#FFF6E8",stroke:"#e8d9bd","stroke-width":2}));
    stxt(400,122,"“"+target.phrase+"”",{"text-anchor":"middle","font-size":19,fill:"#2a2418","font-weight":800,"font-family":"Georgia,serif"},svg);
    stxt(400,154,"streak: "+streak,{"text-anchor":"middle","font-size":12,fill:"#8a6d3b"},svg);
    svg.append(s("rect",{x:90,y:200,width:620,height:70,rx:12,fill:"#131a30",stroke:built.length?"#19C2B8":"#3a4678","stroke-width":2,"stroke-dasharray":built.length?"none":"6 5"}));
    stxt(400,244,built.length?built.join(" "):"click chips below to build the expression",{"text-anchor":"middle","font-size":24,fill:built.length?"#FFB020":"#5a68a0","font-weight":800},svg);
    if(P.reveal)stxt(400,300,"answer: "+M(target.expr),{"text-anchor":"middle","font-size":16,fill:"#E85BD0","font-weight":800},svg);
    if(P.hints)stxt(400,328,"let the unknown number be x · 'less than' reverses the order",{"text-anchor":"middle","font-size":12.5,fill:"#3D8BFF"},svg);
    var chips=["x","2","3","4","5","6","7","8","9","+","−","×","/","(",")","⌫"];
    chips.forEach(function(c,i){
      var col=i%8,row=Math.floor(i/8),x=112+col*76,y=366+row*62;
      var g=s("g",{cursor:"pointer"});
      g.append(s("rect",{x:x,y:y,width:62,height:48,rx:10,fill:"#2E3968",stroke:"#3a4678","stroke-width":2}));
      g.append(stxt(x+31,y+31,c,{"text-anchor":"middle","font-size":20,"font-weight":800,"pointer-events":"none"}));
      g.addEventListener("click",function(){AU.play("click");if(c==="⌫")built.pop();else built.push(c);update();});
      svg.append(g);
    });
  }
  function check(){
    var ok=norm(built.join(""))===norm(target.expr);
    if(ok){
      streak++;api.emit("correct");
      if(streak>=3)api.emit("streak3");
      AU.play("good");
      api.feedback("✓ “"+target.phrase+"” = "+M(target.expr),"good");
      burst(scope,svg,400,235,"#46D46A");
      if(P.auto)scope.timeout(function(){gen();update();},900);
    } else {streak=0;AU.play("bad");api.feedback("Not a match. Read the phrase again — order matters with 'less than'.","bad");}
    update();
  }
  var controls=[
    {t:"select",label:"Phrase set",options:[["mixed","Mixed"],["addsub","Add / subtract"],["muldiv","Multiply / divide"]],get:function(){return P.set;},set:function(v){P.set=v;gen();}},
    {t:"select",label:"Difficulty",options:[[1,"Standard"],[2,"Tricky order"]],get:function(){return P.diff;},set:function(v){P.diff=Number(v);gen();}},
    {t:"toggle",label:"Hint line",get:function(){return P.hints;},set:function(v){P.hints=v;}},
    {t:"toggle",label:"Reveal answer",get:function(){return P.reveal;},set:function(v){P.reveal=v;}},
    {t:"toggle",label:"Auto-advance on success",get:function(){return P.auto;},set:function(v){P.auto=v;}},
    {t:"button",label:"⌫ Clear build",fn:function(){built=[];}},
    {t:"button",label:"⚄ New phrase",fn:function(){gen();}}];
  return{stage:svg,controls:controls,actions:[{label:"✓ Check translation",primary:true,fn:check}],update:update,
    reset:function(){built=[];streak=0;P.hints=false;P.reveal=false;},
    new:function(){gen();streak=0;}};
};
/* tiles */
SIMS.tiles=function(scope,api){
  var P={set:"ux",sign:"both",snap:true,grid:true,xval:3,evaluate:false};
  var svg=baseSVG(),tiles=[],target=null,idc=0;
  function newTarget(){
    var r=mulberry((Date.now()^9)>>>0);
    var maxX=P.set==="u"?0:3;
    var x=maxX===0?0:(ri(r,-2,maxX)||2);
    var u=ri(r,-3,4);
    if(P.sign==="pos"){x=Math.abs(x);u=Math.abs(u);}
    if(P.sign==="neg"){x=-Math.abs(x);u=-Math.abs(u);}
    target={x:x,u:u};
  }
  newTarget();
  function counts(){var c={x:0,u:0,x2:0};tiles.forEach(function(t){c[t.k]+=t.s;});return c;}
  function exprStr(){
    var c=counts(),parts=[];
    if(c.x2)parts.push(tx(c.x2,"x²"));
    if(c.x)parts.push(tx(c.x,"x"));
    if(c.u||!parts.length)parts.push(parts.length?pm(c.u):M(c.u));
    return parts.join(" ").replace(/^\+/,"").trim()||"0";
  }
  function checkTarget(){
    var c=counts();
    if(target&&c.x===target.x&&c.u===target.u&&c.x2===0){
      api.emit("build-match");
      api.feedback("Target built: "+poly(target.x,target.u)+" ✓","good");
      confetti();
      scope.timeout(function(){newTarget();update();},1300);
    }
  }
  function tileEl(t){
    var g=s("g",{cursor:"grab",transform:"translate("+t.x+","+t.y+")"});
    var pos=t.s>0;
    var fill=pos?(t.k==="x"?"#19C2B8":(t.k==="x2"?"#3D8BFF":"#FFB020")):"#E85BD0";
    var w=t.k==="u"?30:64,hh=t.k==="x2"?64:30;
    g.append(s("rect",{x:-w/2,y:-hh/2,width:w,height:hh,rx:5,fill:fill,stroke:"#131a30","stroke-width":2,opacity:0.92}));
    if(t.k==="x")for(var i=1;i<4;i++)g.append(s("line",{x1:-w/2+i*16,y1:-hh/2,x2:-w/2+i*16,y2:hh/2,stroke:"#131a30","stroke-width":1.4,opacity:0.5}));
    if(t.k==="u")g.append(s("circle",{cx:0,cy:0,r:3,fill:"#131a30",opacity:0.5}));
    g.append(stxt(0,5,(pos?"+":"−")+(t.k==="x"?"x":(t.k==="x2"?"x²":"1")),{"text-anchor":"middle","font-size":13,"font-weight":800,fill:"#131a30","pointer-events":"none"}));
    drag(scope,g,function(ev){
      var p=svgPt(svg,ev);
      t.x=clamp(p.x,60,740);t.y=clamp(p.y,130,430);
      g.setAttribute("transform","translate("+t.x+","+t.y+")");
    },function(){
      if(P.snap){t.x=Math.round(t.x/20)*20;t.y=Math.round(t.y/20)*20;}
      var hit=null;
      tiles.forEach(function(o){if(o!==t&&o.k===t.k&&o.s===-t.s&&Math.hypot(o.x-t.x,o.y-t.y)<34&&!hit)hit=o;});
      if(hit){
        tiles=tiles.filter(function(o){return o!==t&&o!==hit;});
        burst(scope,svg,t.x,t.y,"#E85BD0");AU.play("pop");api.emit("zero-pair");
        api.feedback("Zero pair annihilated — opposites cancel to 0.","good");
        checkTarget();
      }
      update();
    });
    return g;
  }
  function update(){
    svg.innerHTML="";
    stxt(400,46,"ALGEBRA TILES BENCH",{"text-anchor":"middle","font-size":15,fill:"#19C2B8","font-weight":800,"letter-spacing":4},svg);
    if(P.grid)for(var x=60;x<=740;x+=40)svg.append(s("line",{x1:x,y1:110,x2:x,y2:440,stroke:"#242D52","stroke-width":1}));
    svg.append(s("rect",{x:50,y:105,width:700,height:340,rx:14,fill:"none",stroke:"#3a4678","stroke-width":2}));
    stxt(400,82,"🎯 build: "+poly(target.x,target.u),{"text-anchor":"middle","font-size":17,fill:"#FFB020","font-weight":800},svg);
    tiles.forEach(function(t){svg.append(tileEl(t));});
    var c=counts(),read="expression: "+exprStr();
    if(P.evaluate)read+="   ·   at x = "+M(P.xval)+": "+M(c.x2*P.xval*P.xval+c.x*P.xval+c.u);
    stxt(400,478,read,{"text-anchor":"middle","font-size":16,fill:"#46D46A","font-weight":800},svg);
    var pal=[["u",1,"+1"],["u",-1,"−1"],["x",1,"+x"],["x",-1,"−x"]];
    if(P.set==="all")pal.push(["x2",1,"+x²"],["x2",-1,"−x²"]);
    var shown=pal.filter(function(p){
      if(P.set==="u"&&p[0]!=="u")return false;
      if(P.sign==="pos"&&p[1]<0)return false;
      if(P.sign==="neg"&&p[1]>0)return false;
      return true;
    });
    shown.forEach(function(p,i){
      var x=110+i*105,y=505,g=s("g",{cursor:"pointer"});
      g.append(s("rect",{x:x-34,y:y-16,width:68,height:30,rx:8,fill:"#2E3968",stroke:"#19C2B8","stroke-width":1.5}));
      g.append(stxt(x,y+5,p[2],{"text-anchor":"middle","font-size":14,"font-weight":800,"pointer-events":"none"}));
      g.addEventListener("click",function(){
        tiles.push({id:idc++,k:p[0],s:p[1],x:120+Math.random()*560,y:150+Math.random()*250});
        api.emit("spawn");AU.play("click");checkTarget();update();
      });
      svg.append(g);
    });
  }
  function autoPair(){
    var paired=0;
    ["u","x","x2"].forEach(function(k){
      var pos=tiles.filter(function(t){return t.k===k&&t.s>0;});
      var neg=tiles.filter(function(t){return t.k===k&&t.s<0;});
      var n=Math.min(pos.length,neg.length);
      for(var i=0;i<n;i++){
        tiles=tiles.filter(function(t){return t!==pos[i]&&t!==neg[i];});
        paired++;api.emit("zero-pair");
      }
    });
    if(paired){burst(scope,svg,400,270,"#E85BD0");AU.play("pop");api.feedback(paired+" zero pair"+(paired>1?"s":"")+" annihilated.","good");}
    else api.feedback("No opposite tiles to pair yet.","info");
    checkTarget();
  }
  var controls=[
    {t:"select",label:"Tile set",options:[["u","Units only"],["ux","Units + x"],["all","Units + x + x²"]],get:function(){return P.set;},set:function(v){P.set=v;newTarget();}},
    {t:"select",label:"Signs",options:[["both","Positive & negative"],["pos","Positive only"],["neg","Negative only"]],get:function(){return P.sign;},set:function(v){P.sign=v;newTarget();}},
    {t:"toggle",label:"Snap to grid",get:function(){return P.snap;},set:function(v){P.snap=v;}},
    {t:"toggle",label:"Grid guides",get:function(){return P.grid;},set:function(v){P.grid=v;}},
    {t:"range",label:"x value (evaluate)",min:-5,max:6,get:function(){return P.xval;},set:function(v){P.xval=v;}},
    {t:"toggle",label:"Evaluate at x",get:function(){return P.evaluate;},set:function(v){P.evaluate=v;}},
    {t:"button",label:"💥 Auto zero-pair",fn:autoPair},
    {t:"button",label:"🗑 Clear bench",fn:function(){tiles=[];}}];
  return{stage:svg,controls:controls,update:update,
    reset:function(){tiles=[];P.snap=true;P.evaluate=false;newTarget();},
    new:function(){tiles=[];newTarget();api.feedback("New target expression posted.","info");}};
};
/* sorter */
SIMS.sorter=function(scope,api,opts){
  var P={count:opts.count||6,coeff:6,neg:true,x2:!!opts.x2,timer:false,hints:true};
  var svg=baseSVG(),chips=[],buckets=[],misses=0,sorted=0,timeLeft=30,active=true;
  function fams(){return P.x2?["x²","x","1"]:["x","1"];}
  function gen(){
    var r=mulberry((Date.now()^5)>>>0),fs=fams();
    chips=[];misses=0;sorted=0;timeLeft=30;active=true;
    for(var i=0;i<P.count;i++){
      var k=pick(r,fs),c=ri(r,1,P.coeff)*(P.neg&&r()<0.4?-1:1);
      chips.push({k:k,c:c,x:100+(i%5)*140,y:110+Math.floor(i/5)*64,done:false});
    }
    buckets=fs.map(function(f,i){return{f:f,x:fs.length===1?400:130+i*(540/(fs.length-1)),n:0,sum:0};});

/* balance engine */
function balanceFactory(scope,api,opts){
  var balloon=!!opts.balloon;
  var P={a:3,b:2,t:11,op:"-",amt:2,lock:true,side:"left",rightX:!!opts.bothSides,hints:true,speed:1};

  var svg=baseSVG();
  function net(sd){return sd.cp-sd.cn;}
  function setNet(sd,v){sd.cp=Math.max(v,0);sd.cn=Math.max(-v,0);}
  function gen(){
    var r=mulberry((Date.now()^13)>>>0);
    secret=balloon?ri(r,-6,9):ri(r,1,9);
    P.a=ri(r,2,5);
    P.b=balloon?ri(r,-9,9):ri(r,0,9);
    var rx=P.rightX?ri(r,1,P.a-1):0;
    L={x:P.a,cp:0,cn:0};setNet(L,P.b);
    R={x:rx,cp:0,cn:0};setNet(R,(P.a-rx)*secret+P.b);
    P.t=net(R);solved=false;logLines=[];angle=0;
  }
  gen();
  function diff(){return (L.x*secret+net(L))-(R.x*secret+net(R));}
  function sideStr(sd){
    var p=tx(sd.x,"x"),n=net(sd);
    if(n!==0||p==="")p+=p?pm(n):M(n);
    return p===""?"0":p;
  }
  function eqStr(){return sideStr(L)+" = "+sideStr(R);}
  function targets(){return P.lock?[L,R]:[P.side==="left"?L:R];}
  function applyOp(){
    var op=P.op,n=P.amt,tg=targets();
    if(op==="÷"){
      if(n===0){api.feedback("Cannot divide by zero.","bad");return;}
      for(var i=0;i<tg.length;i++){
        if(tg[i].x%n!==0||tg[i].cp%n!==0||tg[i].cn%n!==0){
          api.feedback("Doesn't split into "+n+" equal groups evenly — try another divisor.","bad");AU.play("bad");return;
        }
      }
    }
    tg.forEach(function(sd){
      if(op==="+"){var c=Math.min(sd.cn,n);sd.cn-=c;sd.cp+=n-c;}
      else if(op==="-"){var t=Math.min(sd.cp,n);sd.cp-=t;sd.cn+=n-t;}
      else if(op==="×"){sd.x*=n;sd.cp*=n;sd.cn*=n;}
      else if(op==="÷"){sd.x/=n;sd.cp/=n;sd.cn/=n;}

/* pipeline */
SIMS.pipeline=function(scope,api,opts){
  var P={steps:2,a:3,b:opts.neg?-4:2,secret:4,show:true,speed:1,hints:true};
  var svg=baseSVG(),slots=[],palette=[],misses=0,running=false;
  function fwd(){
    var f=[{op:"×",n:P.a},{op:P.b<0?"−":"+",n:Math.abs(P.b)}];
    if(P.steps===3)f.push({op:"−",n:3});
    return f;
  }
  function inverse(f){
    return f.map(function(st){return{op:st.op==="×"?"÷":(st.op==="÷"?"×":(st.op==="+"?"−":"+")),n:st.n};}).reverse();
  }
  function outVal(){
    var v=P.secret;
    fwd().forEach(function(st){v=st.op==="×"?v*st.n:(st.op==="÷"?v/st.n:(st.op==="+"?v+st.n:v-st.n));});
    return v;
  }
  function gen(){
    slots=inverse(fwd()).map(function(){return null;});
    var r=mulberry((Date.now()^17)>>>0);
    var distr=[{op:"×",n:P.a},{op:"+",n:Math.abs(P.b)||2},{op:"−",n:P.a}];
    palette=shuffle(r,inverse(fwd()).concat(distr)).map(function(c,i){return{op:c.op,n:c.n,id:i,used:false};});
    misses=0;running=false;
  }
  gen();
  function chipTxt(c){return c.op+" "+c.n;}
  function update(){
    svg.innerHTML="";
    stxt(400,44,"UNDO PIPELINE",{"text-anchor":"middle","font-size":15,fill:"#19C2B8","font-weight":800,"letter-spacing":4},svg);
    var f=fwd();
    stxt(400,76,"forward:  x "+f.map(function(st){return "→ ["+st.op+" "+st.n+"]";}).join(" ")+" → "+M(outVal()),{"text-anchor":"middle","font-size":17,fill:"#9aa7cf","font-weight":800},svg);
    var v=P.secret,fw=[v];
    f.forEach(function(st){v=st.op==="×"?v*st.n:(st.op==="÷"?v/st.n:(st.op==="+"?v+st.n:v-st.n));fw.push(v);});
    var bw=110,gap=30,x0=400-((f.length+1)*bw+f.length*gap)/2;
    fw.forEach(function(val,i){
      var x=x0+i*(bw+gap);
      if(i>0){
        var st=f[i-1];
        svg.append(s("rect",{x:x-gap-6,y:112,width:gap+12,height:52,rx:9,fill:"#2E3968",stroke:"#3D8BFF","stroke-width":2}));
        stxt(x-gap/2,144,st.op+" "+st.n,{"text-anchor":"middle","font-size":15,"font-weight":800,fill:"#3D8BFF"},svg);
      }
      svg.append(s("rect",{x:x,y:112,width:bw,height:52,rx:11,fill:"#242D52",stroke:"#3a4678","stroke-width":2}));
      var show=(i===0||i===fw.length-1||P.show);
      stxt(x+bw/2,145,show?(i===0?"x = ?":M(val)):"?",{"text-anchor":"middle","font-size":19,"font-weight":800,fill:i===fw.length-1?"#FFB020":"#EDF2FF"},svg);
    });
    stxt(400,208,"reverse — undo the LAST operation first:",{"text-anchor":"middle","font-size":13,fill:"#9aa7cf"},svg);
    var inv=inverse(f),sx0=400-inv.length*100/2;
    inv.forEach(function(exp,i){
      var x=sx0+i*100+50,filled=slots[i];
      svg.append(s("rect",{x:x-42,y:228,width:84,height:56,rx:11,fill:filled?"rgba(70,212,106,.15)":"#131a30",stroke:filled?"#46D46A":"#3a4678","stroke-width":2,"stroke-dasharray":filled?"none":"5 4"}));
      stxt(x,262,filled?chipTxt(filled):("slot "+(i+1)),{"text-anchor":"middle","font-size":16,"font-weight":800,fill:filled?"#46D46A":"#5a68a0"},svg);
      if(P.hints&&!filled)stxt(x,300,"undo ["+f[f.length-1-i].op+" "+f[f.length-1-i].n+"]",{"text-anchor":"middle","font-size":10.5,fill:"#3D8BFF"},svg);
    });
    stxt(400,340,"operation chips — click to place:",{"text-anchor":"middle","font-size":13,fill:"#9aa7cf"},svg);
    palette.forEach(function(c,i){
      if(c.used)return;
      var col=i%6,row=Math.floor(i/6),x=140+col*105,y=376+row*58;
      var g=s("g",{cursor:"pointer"});
      g.append(s("rect",{x:x-40,y:y-22,width:80,height:44,rx:10,fill:"#2E3968",stroke:"#FFB020","stroke-width":2}));
      g.append(stxt(x,y+6,chipTxt(c),{"text-anchor":"middle","font-size":16,"font-weight":800,"pointer-events":"none"}));
      g.addEventListener("click",function(){
        if(running)return;
        var si=-1;
        for(var k=0;k<slots.length;k++){if(!slots[k]){si=k;break;}}
        if(si<0)return;
        var exp=inv[si];
        if(c.op===exp.op&&c.n===exp.n){
          slots[si]=c;c.used=true;api.emit("slot");AU.play("good");
          api.feedback("✓ "+chipTxt(c)+" undoes "+f[f.length-1-si].op+" "+f[f.length-1-si].n,"good");
          if(slots.every(function(x2){return x2;}))api.feedback("Pipeline complete — press RUN UNDO to free x.","good");
        } else {
          misses++;AU.play("bad");
          api.feedback("✗ "+chipTxt(c)+" is not the inverse of "+f[f.length-1-si].op+" "+f[f.length-1-si].n+". Opposite operation, same number.","bad");
        }
        update();
      });
      svg.append(g);
    });
    stxt(400,486,"misses: "+misses,{"text-anchor":"middle","font-size":13,fill:misses?"#FF4D5E":"#9aa7cf"},svg);
  }
  function run(){
    if(!slots.every(function(x){return x;})){api.feedback("Fill every slot first.","bad");return;}
    running=true;
    var v=outVal(),start=v,vals=[];
    slots.forEach(function(sl){v=sl.op==="×"?v*sl.n:(sl.op==="÷"?v/sl.n:(sl.op==="+"?v+sl.n:v-sl.n));vals.push(v);});
    var inv=inverse(fwd()),sx0=400-inv.length*100/2;
    var ball=s("circle",{cx:sx0+inv.length*100-50,cy:256,r:13,fill:"#FFB020",stroke:"#131a30","stroke-width":2});
    svg.append(ball);
    tween(scope,1600/P.speed,function(k){
      var x=(sx0+(inv.length-1)*100+50)-k*(inv.length*100);
      ball.setAttribute("cx",x);
    },function(){
      ball.remove();
      api.emit("undo-correct");
      if(misses===0)api.emit("perfect");
      if(P.b<0||P.secret<0)api.emit("negative");
      api.feedback("Undo complete: "+M(start)+" → "+vals.map(M).join(" → ")+"   ⇒   x = "+M(P.secret)+" ✓","good");
      AU.play("goal");confetti();
      scope.timeout(function(){
        var r=mulberry(Date.now()>>>0);
        P.secret=ri(r,-6,9);P.a=ri(r,2,6);P.b=ri(r,-9,9);
        gen();api.sync();update();
      },1900);
    });
  }
  var controls=[
    {t:"select",label:"Machine steps",options:[[2,"2 steps"],[3,"3 steps"]],get:function(){return P.steps;},set:function(v){P.steps=Number(v);gen();}},
    {t:"step",label:"Multiplier a",min:2,max:6,get:function(){return P.a;},set:function(v){P.a=v;gen();}},
    {t:"step",label:"Added constant b",min:-9,max:9,get:function(){return P.b;},set:function(v){P.b=v;gen();}},
    {t:"step",label:"Secret x",min:-6,max:9,get:function(){return P.secret;},set:function(v){P.secret=v;}},
    {t:"toggle",label:"Show forward values",get:function(){return P.show;},set:function(v){P.show=v;}},
    {t:"range",label:"Run speed",min:0.5,max:2.5,step:0.25,get:function(){return P.speed;},set:function(v){P.speed=v;},fmt:function(v){return v+"×";}},
    {t:"toggle",label:"Slot hints",get:function(){return P.hints;},set:function(v){P.hints=v;}}];
  return{stage:svg,controls:controls,actions:[{label:"▶ RUN UNDO",primary:true,fn:run}],update:update,
    reset:function(){P.steps=2;P.a=3;P.b=2;P.secret=4;gen();},
    new:function(){var r=mulberry(Date.now()>>>0);P.secret=ri(r,-6,9);P.a=ri(r,2,6);P.b=ri(r,-9,9);gen();api.feedback("New machine wired. Build its undo.","info");}};
};
/* gatekeeper — persistent, drag-safe */
SIMS.gatekeeper=function(scope,api,opts){
  var P={mode:opts.mode||"graph",b:3,cmp:">",scale:2,rain:true,rainSpeed:1,hints:true};
  var svg=baseSVG(),X=function(v){return 400+v*34;},LY=310;
  var card=null,drops=[],caught=0,lastSign=1;
  var scaleVals=[-4,-3,-2,-1,1,2,3,4];
  function newCard(){
    var r=mulberry((Date.now()^19)>>>0);
    if(P.mode==="flip")card={a:-ri(r,2,4),c:ri(r,-8,8),cmp:"<"};
    else card={b:ri(r,-5,5),cmp:pick(r,[">","≥","<","≤"])};
  }
  newCard();
  function satisfies(v,b,cmp){
    if(cmp===">")return v>b;
    if(cmp==="≥")return v>=b;
    if(cmp==="<")return v<b;
    return v<=b;
  }
  function flipCmp(c){return c==="<"?">":(c===">"?"<":(c==="≤"?"≥":"≤"));}
  function currentGraph(){
    if(P.mode==="flip"){
      var b=card.c/P.scale;
      return{b:b,cmp:P.scale>0?card.cmp:flipCmp(card.cmp)};
    }
    return{b:P.b,cmp:P.cmp};
  }
  stxt(400,44,"INEQUALITY GATEKEEPER",{"text-anchor":"middle","font-size":15,fill:"#19C2B8","font-weight":800,"letter-spacing":4},svg);
  var cardT=stxt(400,80,"",{"text-anchor":"middle","font-size":19,"font-weight":800,fill:"#FFB020"},svg);
  var flipT=stxt(400,106,"",{"text-anchor":"middle","font-size":14,"font-weight":800,fill:"#E85BD0"},svg);
  var axisG=s("g",{});svg.append(axisG);
  var shade=s("line",{x1:0,y1:LY,x2:0,y2:LY,stroke:"#19C2B8","stroke-width":7,"stroke-linecap":"round",opacity:0.85});
  svg.append(shade);
  var dot=s("circle",{cx:0,cy:LY,r:11,fill:"#19C2B8",stroke:"#19C2B8","stroke-width":3.5,cursor:"ew-resize"});
  svg.append(dot);
  var dropG=s("g",{});svg.append(dropG);
  var hintT=stxt(400,470,"",{"text-anchor":"middle","font-size":12.5,fill:"#3D8BFF"},svg);
  var countT=stxt(400,496,"",{"text-anchor":"middle","font-size":13,fill:"#9aa7cf"},svg);
  function update(){
    var g=currentGraph();
    if(P.mode==="flip"){
      cardT.textContent=M(card.a+"x "+card.cmp+" "+card.c)+"   ÷("+M(P.scale)+") →   x "+g.cmp+" "+fmtN(g.b);
      flipT.textContent=P.scale<0?"⚡ divided by a NEGATIVE — the sign FLIPS!":"dividing by a positive keeps the sign";
    } else {

      flipT.textContent="";
    }
    axisG.innerHTML="";
    axisG.append(s("line",{x1:40,y1:LY,x2:760,y2:LY,stroke:"#9aa7cf","stroke-width":2.5}));
    for(var v=-10;v<=10;v++){
      axisG.append(s("line",{x1:X(v),y1:LY-7,x2:X(v),y2:LY+7,stroke:v===0?"#FFB020":"#9aa7cf","stroke-width":v===0?3:1.5}));
      if(v%2===0)stxt(X(v),LY+28,M(v),{"text-anchor":"middle","font-size":12,fill:"#9aa7cf"},axisG);
    }
    var closed=g.cmp==="≥"||g.cmp==="≤",dir=(g.cmp===">"||g.cmp==="≥")?1:-1;
    var bx=X(clamp(g.b,-10,10));
    shade.setAttribute("x1",bx);shade.setAttribute("x2",dir>0?756:44);
    dot.setAttribute("cx",bx);
    dot.setAttribute("fill",closed?"#19C2B8":"#1a2140");
    dot.setAttribute("opacity",P.mode==="flip"?0.6:1);
    hintT.textContent=P.mode==="graph"?"drag the dot · pick the comparator · the rain verifies your gate":"slide the divisor below zero and watch the gate flip";
    countT.textContent="values classified: "+caught;
  }
  function checkGraph(){
    if(P.mode!=="graph")return;
    var cu=P.cmp==="≥"||P.cmp==="≤",cc=card.cmp==="≥"||card.cmp==="≤";
    var du=P.cmp===">"||P.cmp==="≥",dc=card.cmp===">"||card.cmp==="≥";
    if(P.b===card.b&&cu===cc&&du===dc){
      api.emit("graph-correct");
      api.feedback("✓ Gate matches x "+card.cmp+" "+M(card.b)+" — the rain agrees.","good");

    }
  }
  drag(scope,dot,function(ev){
    if(P.mode!=="graph")return;

    api.sync();update();
  },function(){checkGraph();});
  scope.interval(function(){
    if(!P.rain||drops.length>10)return;
    var v=ri(Math.random,-9,9);
    var g=s("g",{});
    var c=s("circle",{cx:0,cy:0,r:13,fill:"#242D52",stroke:"#EDF2FF","stroke-width":2.5});
    var t=stxt(0,5,M(v),{"text-anchor":"middle","font-size":12,"font-weight":800});

    drops=alive;
  });
  var controls=[
    {t:"select",label:"Mode",options:[["graph","Graph the gate"],["flip","Flip-rule lab"]],get:function(){return P.mode;},set:function(v){P.mode=v;newCard();}},
    {t:"step",label:"Boundary (drag dot too)",min:-10,max:10,get:function(){return P.b;},set:function(v){P.b=v;checkGraph();}},
    {t:"select",label:"Comparator",options:[[">","> open right"],["≥","≥ closed right"],["<","< open left"],["≤","≤ closed left"]],get:function(){return P.cmp;},set:function(v){P.cmp=v;checkGraph();}},
    {t:"range",label:"Divide both sides by",min:0,max:7,get:function(){return scaleVals.indexOf(P.scale);},set:function(v){
      var old=P.scale;P.scale=scaleVals[v];

      api.sync();
    },fmt:function(){return M(P.scale);}},
    {t:"toggle",label:"Value rain",get:function(){return P.rain;},set:function(v){P.rain=v;}},
    {t:"range",label:"Rain speed",min:0.5,max:2.5,step:0.25,get:function(){return P.rainSpeed;},set:function(v){P.rainSpeed=v;},fmt:function(v){return v+"×";}},
    {t:"toggle",label:"Hint line",get:function(){return P.hints;},set:function(v){P.hints=v;}},
    {t:"button",label:"✓ Check my gate",primary:true,fn:checkGraph}];
  return{stage:svg,controls:controls,update:update,
    reset:function(){P.b=3;P.cmp=">";P.scale=2;newCard();},
    new:function(){newCard();api.feedback("New inequality card posted.","info");}};

/* sledder — persistent, one loop */
SIMS.sledder=function(scope,api,opts){

      retry.addEventListener("click",route);
      return[retry,h("a",{class:"btn",href:"#/world/"+wid},"Back to camp"),
        res.pass&&i<WORLDS.length-1?h("a",{class:"btn gold",href:"#/world/"+WORLDS[i+1].id},"Next camp: "+WORLDS[i+1].name+" →"):
        (res.pass?h("a",{class:"btn gold",href:"#/trophies"},"🏆 Claim your trophies"):null)];

      var ws=wState(wid);

    }}));
};
V.supply=function(scope){

V.trophies=function(scope){

    h("div",{style:"font-size:44px"},"🧗"),
    h("h3",{style:"font-family:var(--disp);font-size:24px"},r[0]),

    h("div",{class:"pbar",style:"max-width:none;margin-top:10px"},h("i",{style:"width:"+(nr?clamp((ST.xp-r[1])/(nr[1]-r[1])*100,0,100):100)+"%"}))));
  var groups=GROUPS.map(function(g){
    var keys=Object.keys(ST.skills).filter(function(k){return SKILLMETA[k]&&SKILLMETA[k][1]===g;});

  });
  var cx=170,cy=150,R=100,n=GROUPS.length;

  for(var ring=1;ring<=4;ring++){
    var pts=GROUPS.map(function(_,i){var a=-Math.PI/2+i/n*2*Math.PI;return (cx+Math.cos(a)*R*ring/4)+","+(cy+Math.sin(a)*R*ring/4);}).join(" ");
    radar.append(s("polygon",{points:pts,fill:"none",stroke:"#3a4678","stroke-width":1}));
  }
  GROUPS.forEach(function(g,i){
    var a=-Math.PI/2+i/n*2*Math.PI;
    radar.append(s("line",{x1:cx,y1:cy,x2:cx+Math.cos(a)*R,y2:cy+Math.sin(a)*R,stroke:"#3a4678","stroke-width":1}));
    stxt(cx+Math.cos(a)*(R+26),cy+Math.sin(a)*(R+18),g,{"text-anchor":"middle","font-size":9.5,fill:"#9aa7cf","font-family":"Inter,sans-serif"},radar);
  });
  var poly2=groups.map(function(v,i){var a=-Math.PI/2+i/n*2*Math.PI,rr=R*clamp(v,4,100)/100;return (cx+Math.cos(a)*rr)+","+(cy+Math.sin(a)*rr);}).join(" ");
  radar.append(s("polygon",{points:poly2,fill:"rgba(25,194,184,.25)",stroke:"#19C2B8","stroke-width":2.5}));
  groups.forEach(function(v,i){var a=-Math.PI/2+i/n*2*Math.PI,rr=R*clamp(v,4,100)/100;radar.append(s("circle",{cx:cx+Math.cos(a)*rr,cy:cy+Math.sin(a)*rr,r:4,fill:"#FFB020"}));});
  left.append(h("div",{class:"card reveal"},h("b",null,"Mastery radar"),h("div",{class:"sub",style:"margin-bottom:6px"},"Decays gently without practice — keep trails warm."),radar));
  left.append(h("div",{class:"card reveal"},h("b",null,"Expedition stats"),
    h("div",{class:"statrow",style:"justify-content:flex-start;margin:10px 0 0"},
      h("div",{class:"stat"},h("b",null,ST.stats.correct+"/"+ST.stats.items),h("span",null,"ANSWERS")),
      h("div",{class:"stat"},h("b",null,String(ST.stats.maxRow)),h("span",null,"BEST ROW")),
      h("div",{class:"stat"},h("b",null,String(ST.stats.zeroPairs)),h("span",null,"ZERO PAIRS")),
      h("div",{class:"stat"},h("b",null,Object.keys(ST.badges).length+"/24"),h("span",null,"BADGES")))));
  var bwrap=h("div",{class:"card reveal"},h("b",null,"Badge collection · "+Object.keys(ST.badges).length+"/24"),
    h("div",{class:"badges",style:"margin-top:12px"},BADGES.map(function(b){
      return h("div",{class:"badge"+(ST.badges[b[0]]?" got":"")},h("div",{class:"em"},b[1]),h("h5",null,b[2]),h("p",null,b[3]),
        ST.badges[b[0]]?h("p",{style:"color:var(--gold)"},ST.badges[b[0]]):null);
    })));
  view.append(h("div",{class:"tgrid"},left,bwrap));
  revealInit();
};
V.guide=function(scope){
  SKY.target=0.4;
  view.append(h("h2",{class:"sec"},"📖 Field Guide"),
    h("p",{class:"sub",style:"margin-bottom:16px"},"Every rule on the mountain, in one place. Open a section, read the example, then steer the matching machine."));
  var G=[
  ["🧭 Integers & the number line","Adding a positive moves right; adding a negative moves left. Subtracting is adding the opposite. Same signs multiply/divide to positive; different signs to negative.","−4 − (−6) = −4 + 6 = 2   ·   (−3)(−2) = 6"],
  ["🏭 Order of operations","Brackets → Exponents → Multiplication & Division (left to right) → Addition & Subtraction (left to right).","3 + 4 × 2 = 11   ·   (3 + 4) × 2 = 14"],
  ["📦 Variables & vocabulary","A variable holds a number. The coefficient multiplies it; the constant stands alone. Evaluate by substituting into every copy.","7x + 4 at x = 3 → 7(3) + 4 = 25"],
  ["🧱 Like terms & zero pairs","Only identical variable parts combine. A value plus its opposite is a zero pair and vanishes.","3x + 5 + 2x − 2 = 5x + 3   ·   (+1) + (−1) = 0"],
  ["🌿 Distributive property","Multiply the outside by EACH inside term. It is the area of a split rectangle.","3(x + 4) = 3x + 12   ·   −2(x − 5) = −2x + 10"],
  ["⚖️ Solving equations","An equation is a level balance. Do the same thing to both sides. Undo +/− first, then ×/÷. Collect variables on one side. Always verify by substitution.","5x + 2 = 3x + 8 → 2x = 6 → x = 3   ·   check: 17 = 17 ✓"],
  ["🏹 Inequalities & the flip rule","Solve like equations, but multiplying or dividing by a NEGATIVE flips the sign. Graph with open (>, <) or closed (≥, ≤) dots.","−2x < 6 → x > −3"],
  ["🛷 Lines & slope","Slope m = rise ÷ run = (y₂−y₁)/(x₂−x₁). b is the y-intercept. Patterns with a constant rate are lines: count = rate·n + start.","(1,2) → (3,6): m = 2   ·   y = 2x − 3"],
  ["🏔 Systems & modeling","Name the unknown, build the equation, solve, check against the story. Two lines cross at the (x, y) satisfying both.","y = 2x + 1 and y = −x + 4 → x = 1, y = 3"]];
  G.forEach(function(g){
    view.append(h("details",{class:"g reveal"},h("summary",null,g[0]),h("div",{class:"gb"},h("p",null,g[1]),h("div",{class:"ex"},g[2]))));
  });
  view.append(h("div",{class:"paper reveal",style:"margin-top:16px"},h("h3",null,"The hero's five moves"),
    h("p",null,"1 · Read and name the unknown x.  2 · Build the equation.  3 · Undo operations in reverse order, both sides always.  4 · Isolate x.  5 · Substitute back and verify. Every problem on this mountain falls to these five moves.")));
  revealInit();
};
V.settings=function(scope){
  SKY.target=0.3;
  view.append(h("h2",{class:"sec"},"⚙ Settings & Progress"));
  var card=h("div",{class:"card",style:"max-width:660px"});
  function row(title,sub,ctl){card.append(h("div",{class:"setrow"},h("div",{class:"st"},h("b",null,title),h("span",null,sub)),ctl));}
  function toggle(get,set){
    var sw=h("button",{class:"sw"+(get()?" on":""),"aria-label":"toggle"});
    sw.addEventListener("click",function(){set(!get());sw.classList.toggle("on",get());});
    return sw;
  }
  row("Sound","Synthesized effects and mountain wind. One switch mutes everything.",toggle(function(){return ST.settings.sound;},function(v){AU.ensure();AU.setOn(v);}));
  row("Motion","Sky drift, sled rides, tweens and confetti. Off = instant, calm rendering.",toggle(function(){return ST.settings.motion;},function(v){ST.settings.motion=v;save();document.body.classList.toggle("nomo",!v);}));
  row("High contrast","Brighter secondary text and borders.",toggle(function(){return ST.settings.contrast;},function(v){ST.settings.contrast=v;save();document.body.classList.toggle("hc",v);}));
  var exp=h("button",{class:"btn sm"},"⤓ Export JSON");
  exp.addEventListener("click",function(){
    var a=document.createElement("a");
    a.download="algebra-ascent-progress.json";
    a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(ST,null,1));
    a.click();toast("Progress exported");
  });
  row("Export progress","Download your whole expedition as a JSON file.",exp);
  var fileInp=h("input",{type:"file",accept:".json",style:"display:none"});
  scope.on(fileInp,"change",function(){
    var f=fileInp.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var data=JSON.parse(rd.result);
        if(data&&data.v===1&&data.worlds&&data.settings&&data.stats){
          ST=data;save();applySettings();syncNav();toast("Progress imported ✓","gold");route();
        } else toast("That file isn't an Algebra Ascent save.");
      }catch(e){toast("Could not read that file.");}
    };
    rd.readAsText(f);
  });
  var imp=h("button",{class:"btn sm ghost"},"⤒ Import JSON");
  imp.addEventListener("click",function(){fileInp.click();});
  row("Import progress","Restore from an exported JSON file.",imp);
  var demo=h("button",{class:"btn sm ghost"},"Load demo");
  demo.addEventListener("click",function(){
    modal("Load demo expedition?","This replaces your current progress with a seeded mid-climb save so you can preview the whole mountain.",[
      {label:"Cancel"},
      {label:"Load demo",cls:"gold",fn:function(){
        ST=fresh();ST.xp=1240;ST.streak={count:3,last:today()};
        for(var i=0;i<3;i++){
          var d=new Date();d.setDate(d.getDate()-i);
          ST.days[d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")]=1;
        }
        for(var k=0;k<5;k++){
          var w=WORLDS[k];
          w.lessons.forEach(function(l){var ls=lState(w.id,l.id);ls.sim=true;ls.done=true;ls.best=7;});
          var ws=wState(w.id);ws.boss.cleared=true;ws.boss.best=9;
        }
        Object.keys(SKILLMETA).slice(0,20).forEach(function(sk,i2){ST.skills[sk]={m:55+(i2*7)%40,seen:8,last:today()};});
        ST.stats.items=210;ST.stats.correct=178;ST.stats.maxRow=9;ST.stats.zeroPairs=14;ST.stats.tiles=120;
        ST.stats.sims={hopper:1,factory:1,machine:1,translator:1,tiles:1,sorter:1,greenhouse:1,balance:1,pipeline:1};
        save();checkBadges();syncNav();route();toast("Demo expedition loaded","gold");
      }}]);
  });
  row("Load demo expedition","Seed W1–W5 cleared with 1,240 XP to preview the full mountain.",demo);
  var erase=h("button",{class:"btn sm red"},"Erase");
  erase.addEventListener("click",function(){
    modal("Erase all progress?","Every XP point, badge and cleared gate will be gone from this browser.",[
      {label:"Keep my climb"},
      {label:"Erase",cls:"red",fn:function(){
        try{localStorage.removeItem(KEY);}catch(e){}
        ST=fresh();applySettings();syncNav();location.hash="#/map";route();toast("Progress erased — a fresh mountain.");
      }}]);
  });
  row("Erase everything","Delete all progress from this device. Cannot be undone.",erase);
  card.append(fileInp);
  view.append(card);
  view.append(h("div",{class:"paper",style:"max-width:660px;margin-top:16px"},h("h3",null,"About & privacy"),
    h("p",null,"Algebra Ascent is a TM Bhinder · Maths Lab Hub expedition for Ontario Grades 5–8, with a Grade 9 hero bonus. It runs entirely in your browser: no accounts, no analytics, no server. Progress lives in this device's localStorage and can be exported, imported or erased above. Sound is synthesized live — no audio files are downloaded.")));
};
V.continue=function(){
  var t=continueTarget();
  location.hash=t?(t.boss?("#/boss/"+t.w.id):("#/practice/"+t.w.id+"/"+t.l.id)):"#/map";

/* ---------- router ---------- */
function route(){
  if(viewScope){viewScope.destroy();viewScope=null;}
  viewScope=new Scope();
  view.innerHTML="";
  window.scrollTo(0,0);
  var parts=(location.hash||"#/map").replace(/^#\//,"").split("/");
  var fn=V[parts[0]]||V.map;
  try{fn(viewScope,parts[1],parts[2],parts[3]);}
  catch(err){
    if(window.console)console.error(err);
    view.append(h("div",{class:"card"},h("h2",{class:"sec"},"Trail slip"),
      h("p",{class:"sub"},"This view hit an error: "+esc(err&&err.message?err.message:"unknown")+". Your progress is safe."),
      h("a",{class:"btn",href:"#/map"},"Back to map")));
  }
  syncNav();
}
function applySettings(){
  document.body.classList.toggle("nomo",!ST.settings.motion);
  document.body.classList.toggle("hc",ST.settings.contrast);
  var b=qs("#sndbtn");
  b.textContent=ST.settings.sound?"🔊":"🔇";
  b.setAttribute("aria-pressed",String(ST.settings.sound));
}
applySettings();
SKY.init();
syncNav();
qs("#sndbtn").addEventListener("click",function(){AU.ensure();AU.setOn(!ST.settings.sound);});
window.addEventListener("pointerdown",function once(){
  AU.ensure();
  if(AU.ctx&&AU.ctx.state==="suspended")AU.ctx.resume();
  window.removeEventListener("pointerdown",once);
});
window.addEventListener("hashchange",route);
window.addEventListener("resize",function(){if(FX.running){FX.cv.width=window.innerWidth;FX.cv.height=window.innerHeight;}});
route();
