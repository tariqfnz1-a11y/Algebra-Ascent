<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algebra Ascent — Zero → Hero · TM Bhinder Maths Lab</title>
<meta name="description" content="Climb from zero to algebra hero through 13 interactive simulations. No accounts. Progress stays on your device.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1B2340;--deep:#131a30;--surf:#242D52;--surf2:#2E3968;--line:#3a4678;
  --teal:#19C2B8;--gold:#FFB020;--green:#46D46A;--red:#FF4D5E;--blue:#3D8BFF;--mag:#E85BD0;
  --paper:#FFF6E8;--ink:#2a2418;--mist:#EDF2FF;--dim:#9aa7cf;
  --disp:"Fraunces",Georgia,serif;--ui:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --nav:64px;--rad:14px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--deep);color:var(--mist);font-family:var(--ui);font-size:15px;line-height:1.5;padding-top:var(--nav);min-height:100vh;overflow-x:hidden}
body.hc{--dim:#c3cdf0;--line:#5a68a0}
body.nomo *{transition:none!important;animation:none!important}
#sky{position:fixed;inset:0;z-index:-2;width:100%;height:100%}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--deep)}
::-webkit-scrollbar-thumb{background:var(--surf2);border-radius:8px;border:2px solid var(--deep)}
::-webkit-scrollbar-thumb:hover{background:var(--teal)}
*{scrollbar-color:var(--surf2) var(--deep);scrollbar-width:thin}
a{color:var(--blue);text-decoration:none}
button{font-family:var(--ui);cursor:pointer}
input,select{font-family:var(--ui)}
.mono{font-family:var(--mono)}
/* NAV */
#nav{position:fixed;top:0;left:0;right:0;height:var(--nav);z-index:50;display:flex;align-items:center;gap:18px;padding:0 18px;background:rgba(19,26,48,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#nav .logo{font-family:var(--disp);font-weight:800;font-size:19px;color:var(--mist);letter-spacing:.5px;white-space:nowrap}
#nav .logo b{color:var(--teal)}
#nav .links{display:flex;gap:4px}
#nav .links a{color:var(--dim);font-weight:600;font-size:13.5px;padding:8px 11px;border-radius:9px}
#nav .links a:hover{color:var(--mist);background:var(--surf)}
#nav .links a.on{color:var(--teal);background:rgba(25,194,184,.12)}
#nav .sp{flex:1}
.xpchip{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:800;color:var(--gold);white-space:nowrap}
.xpbar{width:74px;height:6px;background:var(--deep);border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--mag));border-radius:4px;transition:width .5s}
.streak{font-weight:800;font-size:13px;color:var(--mag);white-space:nowrap}
.icobtn{background:var(--surf);border:1px solid var(--line);color:var(--mist);width:38px;height:38px;border-radius:10px;font-size:16px;display:grid;place-items:center}
.icobtn:hover{border-color:var(--teal)}
#tabbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(19,26,48,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
#tabbar a{flex:1;text-align:center;color:var(--dim);font-size:11px;font-weight:700;padding:6px 2px;border-radius:10px}
#tabbar a.on{color:var(--teal);background:rgba(25,194,184,.12)}
#tabbar a span{display:block;font-size:19px}
/* LAYOUT */
#view{max-width:1180px;margin:0 auto;padding:26px 20px 90px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);padding:20px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#08251f;border:none;font-weight:800;font-size:14px;padding:11px 20px;border-radius:11px;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(25,194,184,.35)}
.btn.gold{background:var(--gold);color:#3a2400}
.btn.ghost{background:var(--surf2);color:var(--mist);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
.chip.ok{color:var(--green);border-color:rgba(70,212,106,.4);background:rgba(70,212,106,.08)}
.chip.gold{color:var(--gold);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.08)}
.chip.lock{color:var(--dim)}
.paper{background:var(--paper);color:var(--ink);border-radius:var(--rad);padding:22px 24px;box-shadow:0 10px 34px rgba(0,0,0,.35);border:1px solid #e8d9bd}
.paper h3{font-family:var(--disp);font-size:21px;margin-bottom:8px}
.paper .ex{font-family:var(--mono);background:#f3e6cc;border:1px dashed #c9b183;border-radius:9px;padding:9px 13px;margin-top:12px;font-size:14px;font-weight:800;color:#5a4318}
h1.big{font-family:var(--disp);font-weight:800;font-size:clamp(34px,6vw,58px);line-height:1.04;letter-spacing:.5px}
h2.sec{font-family:var(--disp);font-weight:800;font-size:26px;margin-bottom:14px}
.sub{color:var(--dim);font-size:14px}
/* MAP */
.hero{position:relative;padding:34px 0 26px;overflow:hidden}
.hero .kicker{color:var(--gold);font-weight:800;letter-spacing:3px;font-size:12px}
.hero h1 span{color:var(--teal)}
.hero .cta{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.mtn{position:absolute;right:-30px;bottom:-8px;width:min(46vw,430px);opacity:.9;pointer-events:none}
.supply{border:1px solid rgba(255,176,32,.5);background:linear-gradient(120deg,rgba(255,176,32,.12),rgba(232,91,208,.10));border-radius:var(--rad);padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0 22px}
.spine{position:relative;margin-top:10px}
.spine::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:3px;background:repeating-linear-gradient(180deg,var(--line) 0 8px,transparent 8px 16px);border-radius:2px}
.wrow{position:relative;display:flex;gap:18px;margin-bottom:16px;align-items:stretch}
.wnode{flex:0 0 56px;display:flex;align-items:flex-start;justify-content:center;padding-top:22px;z-index:1}
.wnode i{width:20px;height:20px;border-radius:50%;background:var(--surf2);border:3px solid var(--line);display:block}
.wrow.open .wnode i{border-color:var(--teal);background:var(--teal);box-shadow:0 0 16px rgba(25,194,184,.7)}
.wrow.clear .wnode i{border-color:var(--gold);background:var(--gold);box-shadow:0 0 14px rgba(255,176,32,.6)}
.wcard{flex:1;display:flex;gap:16px;align-items:center;flex-wrap:wrap;transition:transform .15s,border-color .15s}
.wcard:hover{transform:translateX(4px);border-color:var(--teal)}
.wrow.locked .wcard{opacity:.55;filter:saturate(.5)}
.wcard .em{font-size:34px;width:56px;height:56px;display:grid;place-items:center;background:var(--surf2);border-radius:12px;flex:none}
.wcard .tt{flex:1;min-width:200px}
.wcard .tt h3{font-family:var(--disp);font-size:20px}
.wcard .tt .sub{font-size:12.5px}
.pbar{height:7px;background:var(--deep);border-radius:5px;overflow:hidden;margin-top:8px;max-width:260px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width .5s}
.cal{display:flex;gap:5px;margin-top:10px}
.cal i{width:16px;height:16px;border-radius:5px;background:var(--surf2);border:1px solid var(--line)}
.cal i.hit{background:var(--mag);border-color:var(--mag);box-shadow:0 0 8px rgba(232,91,208,.5)}
/* WORLD / LESSON */
.crumb{font-size:13px;color:var(--dim);margin-bottom:14px;display:inline-block}
.crumb:hover{color:var(--teal)}
.whead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.whead .em{font-size:52px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lcard{display:flex;flex-direction:column;gap:10px}
.lcard h3{font-size:16.5px;font-family:var(--disp)}
.lcard .row{display:flex;gap:8px;flex-wrap:wrap}
.bosscard{margin-top:18px;border:1px solid rgba(255,176,32,.45);background:linear-gradient(120deg,rgba(255,176,32,.10),rgba(255,77,94,.08))}
.hearts{font-size:20px;letter-spacing:3px}
.hearts .off{opacity:.22;filter:grayscale(1)}
.lessoncols{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
.actcard{display:flex;flex-direction:column;gap:10px}
.actcard .big-em{font-size:38px}
/* SIM SHELL */
.simwrap{display:flex;flex-direction:column;gap:12px}
.mission{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);padding:12px 16px}
.mission .mt{font-weight:800;font-size:13.5px;color:var(--gold);white-space:nowrap}
.goal{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;font-weight:600;color:var(--dim);background:var(--surf2);border:1px solid var(--line);padding:5px 11px;border-radius:20px}
.goal.done{color:var(--green);border-color:rgba(70,212,106,.5);background:rgba(70,212,106,.1)}
.goal b{font-family:var(--mono)}
.simgrid{display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start}
.stage{background:linear-gradient(160deg,#20294c,#1a2140);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto;touch-action:none}
.rail{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);padding:14px;display:flex;flex-direction:column;gap:11px;max-height:640px;overflow-y:auto}
.rail h4{font-size:11px;letter-spacing:2.5px;color:var(--teal);font-weight:800}
.ctl{display:flex;flex-direction:column;gap:5px}
.ctl label{font-size:12px;font-weight:700;color:var(--dim);display:flex;justify-content:space-between}
.ctl label output{color:var(--mist);font-family:var(--mono);font-weight:800}
.ctl input[type=range]{-webkit-appearance:none;appearance:none;height:7px;border-radius:5px;background:var(--deep);outline:none}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:var(--teal);border:3px solid #0b3a36;box-shadow:0 0 10px rgba(25,194,184,.6);cursor:pointer}
.ctl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--teal);border:3px solid #0b3a36;cursor:pointer}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surf2);color:var(--teal);font-size:17px;font-weight:800}
.stepper button:hover{border-color:var(--teal)}
.stepper output{flex:1;text-align:center;font-family:var(--mono);font-weight:800;font-size:15px;background:var(--deep);border-radius:8px;padding:5px}
.ctl select{background:var(--deep);color:var(--mist);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:13px;font-weight:600}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tgl span{font-size:12.5px;font-weight:700;color:var(--dim)}
.sw{width:46px;height:25px;border-radius:15px;background:var(--deep);border:1px solid var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--dim);transition:left .2s,background .2s}
.sw.on{background:rgba(25,194,184,.3);border-color:var(--teal)}
.sw.on::after{left:22px;background:var(--teal)}
.rail .uni{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:11px}
.mini-input{display:flex;gap:6px}
.mini-input input{flex:1;min-width:0;background:var(--deep);border:1px solid var(--line);color:var(--mist);border-radius:9px;padding:8px;font-family:var(--mono);font-size:14px}
.dock{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);padding:13px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dock .fb{flex:1;min-width:220px;font-size:14px;font-weight:600}
.dock .fb.good{color:var(--green)}.dock .fb.bad{color:var(--red)}.dock .fb.info{color:var(--blue)}
.dock .log{font-family:var(--mono);font-size:12px;color:var(--dim);width:100%;border-top:1px dashed var(--line);padding-top:8px;display:none}
.dock .log.show{display:block}
.dock .acts{display:flex;gap:8px;flex-wrap:wrap}
.mdone{width:100%;display:flex;gap:10px;align-items:center;background:rgba(70,212,106,.12);border:1px solid rgba(70,212,106,.5);border-radius:10px;padding:9px 13px;font-weight:800;color:var(--green);font-size:13.5px}
/* PRACTICE / BOSS */
.runhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.dots{display:flex;gap:6px;flex:1}
.dots i{width:22px;height:8px;border-radius:5px;background:var(--surf2)}
.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}.dots i.cur{background:var(--gold);box-shadow:0 0 8px rgba(255,176,32,.6)}
.qcard{max-width:720px;margin:0 auto}
.qprompt{font-size:19px;font-weight:600;margin-bottom:18px;line-height:1.55}
.qprompt .mono{font-size:21px;color:var(--gold);font-weight:800}
.qprompt table{border-collapse:collapse;margin:10px 0;font-family:var(--mono)}
.qprompt td,.qprompt th{border:1px solid var(--line);padding:6px 16px;text-align:center}
.ansrow{display:flex;gap:10px;margin:14px 0}
.ansrow input{flex:1;background:var(--deep);border:2px solid var(--line);color:var(--mist);border-radius:12px;padding:13px 16px;font-family:var(--mono);font-size:20px;font-weight:800;outline:none}
.ansrow input:focus{border-color:var(--teal)}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;max-width:430px;margin-bottom:12px}
.keypad button{background:var(--surf2);border:1px solid var(--line);color:var(--mist);font-family:var(--mono);font-size:17px;font-weight:800;padding:11px 0;border-radius:10px}
.keypad button:hover{border-color:var(--teal);color:var(--teal)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{background:var(--surf2);border:2px solid var(--line);color:var(--mist);border-radius:12px;padding:14px;font-size:16px;font-weight:700;font-family:var(--mono);text-align:center;transition:border-color .12s,transform .12s}
.choices button:hover{border-color:var(--teal);transform:translateY(-2px)}
.choices button.pick-ok{border-color:var(--green);background:rgba(70,212,106,.15)}
.choices button.pick-no{border-color:var(--red);background:rgba(255,77,94,.15)}
.choices button svg{width:100%;height:auto}
.stepcard{border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin-bottom:10px;background:var(--surf2)}
.stepcard.done{border-color:rgba(70,212,106,.5)}
.stepcard.fail{border-color:rgba(255,77,94,.5)}
.stepcard .sl{font-size:13px;color:var(--dim);font-weight:700;margin-bottom:6px}
.stepcard .sv{font-family:var(--mono);font-size:18px;font-weight:800;color:var(--green)}
.feedback{border-radius:12px;padding:14px 17px;margin-top:14px;font-weight:600;display:none}
.feedback.show{display:block}
.feedback.ok{background:rgba(70,212,106,.13);border:1px solid rgba(70,212,106,.5);color:var(--green)}
.feedback.no{background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.5);color:#ffb3ba}
.feedback .ex{font-family:var(--mono);font-size:13.5px;margin-top:6px;color:var(--mist)}
.hintbox{background:rgba(61,139,255,.1);border:1px solid rgba(61,139,255,.4);border-radius:11px;padding:11px 15px;margin-top:12px;font-size:13.5px;color:#bcd6ff;display:none}
.hintbox.show{display:block}
.qfoot{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.summary{text-align:center;padding:36px 20px}
.summary .big-em{font-size:64px}
.summary h2{font-family:var(--disp);font-size:32px;margin:10px 0}
.statrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.stat{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:12px 22px;min-width:110px}
.stat b{display:block;font-size:24px;font-family:var(--mono);color:var(--gold)}
.stat span{font-size:11.5px;color:var(--dim);font-weight:700;letter-spacing:1px}
/* LAB */
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.labcard{display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.labcard:hover{transform:translateY(-4px);border-color:var(--teal)}
.labcard .em{font-size:34px}
.labcard.locked{opacity:.5}
/* TROPHIES */
.tgrid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
.badge .em{font-size:30px}
.badge h5{font-size:12.5px;margin-top:6px}
.badge p{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.35}
.badge.got{border-color:rgba(255,176,32,.55);background:linear-gradient(150deg,rgba(255,176,32,.13),rgba(232,91,208,.08));box-shadow:0 0 18px rgba(255,176,32,.12)}
.badge:not(.got){opacity:.45;filter:grayscale(.7)}
/* GUIDE */
details.g{background:var(--surf);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
details.g summary{cursor:pointer;padding:15px 18px;font-weight:800;font-size:15px;list-style:none;display:flex;gap:10px;align-items:center}
details.g summary::before{content:"▸";color:var(--teal);transition:transform .2s}
details.g[open] summary::before{transform:rotate(90deg)}
details.g .gb{padding:0 18px 16px;color:var(--dim);font-size:14px}
details.g .gb .ex{font-family:var(--mono);background:var(--deep);border-radius:8px;padding:8px 12px;margin-top:8px;color:var(--gold);font-size:13.5px}
/* SETTINGS */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow .st b{display:block;font-size:14.5px}
.setrow .st span{font-size:12.5px;color:var(--dim)}
/* TOASTS + MODAL */
#toasts{position:fixed;top:calc(var(--nav) + 12px);right:14px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:320px}
.toast{background:var(--surf2);border:1px solid var(--teal);border-radius:12px;padding:11px 16px;font-size:13px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .3s ease}
.toast.gold{border-color:var(--gold);color:var(--gold)}
.toast.xp{border-color:var(--line);color:var(--gold);font-family:var(--mono)}
@keyframes tin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;z-index:85;display:none;place-items:center;background:rgba(10,14,28,.7);backdrop-filter:blur(4px)}
#modal.show{display:grid}
#modal .mbox{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:420px;width:calc(100% - 40px)}
#modal h3{font-family:var(--disp);margin-bottom:10px}
#modal .macts{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media(max-width:960px){
  .simgrid{grid-template-columns:1fr}
  .rail{max-height:none}
  .lessoncols,.tgrid{grid-template-columns:1fr}
}
@media(max-width:760px){
  #nav .links{display:none}
  #nav{gap:10px;padding:0 12px}
  #tabbar{display:flex}
  #view{padding:18px 13px 110px}
  .xpbar{width:46px}
  .choices{grid-template-columns:1fr}
  .mtn{opacity:.35}
  .keypad{grid-template-columns:repeat(6,1fr)}
}
</style>

 {id:"l2",title:"Combining Like Terms",skill:"like-terms",sim:"sorter",opts:{},story:"x-tiles only combine with x-tiles; units only with units. 3x + 5 + 2x − 2 is just a sorting job: five x's and three units. Sort the falling terms into the right buckets.",example:"3x + 5 + 2x − 2 = 5x + 3",goals:[["sort-correct",8,"Sort 8 terms"],["round-clear",1,"Clear a full round"],["perfect-round",1,"Clear a round with no misses"]]},
 {id:"l3",title:"The Distributive Property",skill:"distribute",sim:"greenhouse",opts:{},story:"a(b + c) is a rectangle: height a, width split into b and c. Its area is ab + ac — multiplication distributes over addition. Drag the splitter and watch the two sub-areas bloom.",example:"3(x + 4) = 3x + 12",goals:[["split",3,"Move the splitter 3 times"],["match",1,"Match the target area"],["negative",1,"Explore a negative side"]]},
 {id:"l4",title:"Simplify Expressions",skill:"simplify",sim:"sorter",opts:{x2:true},story:"Real expressions mix everything: expand brackets first, then sort like terms. Now x² tiles join the bench — they only combine with their own kind. Clear rounds with all three families.",example:"2(x + 3) + 4x = 2x + 6 + 4x = 6x + 6",goals:[["sort-correct",10,"Sort 10 terms"],["round-clear",2,"Clear 2 rounds"],["perfect-round",1,"One perfect round"]]}]},
{id:"w4",n:4,name:"Balance Bridge",em:"⚖️",band:"Gr 6–7",flavor:"An equation is a level beam. Whatever you do to one side, do to the other.",boss:"Keeper of the Beam",lessons:[
 {id:"l1",title:"What Equality Means",skill:"equality",sim:"balance",opts:{},story:"The equals sign is a pivot, not an arrow. 3x + 2 = 11 says both pans weigh the same. Remove weight from only one side and the beam tips — the equation becomes false. Keep it level.",example:"3x + 2 = 11 is true only when x = 3",goals:[["op",3,"Apply 3 operations"],["tilt",1,"Tip the beam with a one-sided move"],["solve",1,"Isolate x"]]},
 {id:"l2",title:"Add & Subtract to Solve",skill:"eq-add",sim:"balance",opts:{},story:"To free the x-crate, undo what sits next to it. If 2 is added, subtract 2 from BOTH pans. The beam stays level and x stands alone. That is the whole secret of one-step equations.",example:"x + 5 = 12 → x + 5 − 5 = 12 − 5 → x = 7",goals:[["op",4,"Apply 4 operations"],["solve",2,"Solve 2 equations"],["tilt",1,"See an imbalance"]]},
 {id:"l3",title:"Multiply & Divide to Solve",skill:"eq-mul",sim:"balance",opts:{},story:"Three identical x-crates balance 12 bags? Split both pans into 3 equal groups: one crate balances 4 bags. Dividing both sides by the coefficient isolates x.",example:"3x = 12 → 3x÷3 = 12÷3 → x = 4",goals:[["op",6,"Apply 6 operations"],["solve",2,"Solve 2 equations"],["tilt",1,"See an imbalance"]]},
 {id:"l4",title:"Check Your Solution",skill:"verify",sim:"balance",opts:{},story:"Heroes verify. Substitute your answer back into the original equation: does the left side equal the right? If the beam levels, your solution is certified. Never skip the check.",example:"x=4 in 3x=12: 3(4)=12 ✓",goals:[["solve",2,"Solve 2 equations"],["op",5,"Apply 5 operations"],["tilt",1,"See an imbalance"]]}]},
{id:"w5",n:5,name:"Two-Step Tunnel",em:"🚇",band:"Gr 7",flavor:"Two operations wrapped around x. Undo them in reverse order to get out.",boss:"Reverse Engineer",lessons:[
 {id:"l1",title:"Undo the Machine",skill:"twostep",sim:"pipeline",opts:{},story:"3x + 2 = 11 means x was multiplied by 3, then 2 was added. To undo, reverse the order: subtract 2 first, then divide by 3. Like taking off shoes and socks — reverse order.",example:"3x+2=11 → 3x=9 → x=3",goals:[["slot",4,"Place 4 inverse operations"],["undo-correct",2,"Undo 2 machines"],["perfect",1,"One flawless undo"]]},
 {id:"l2",title:"Divide First or Subtract First?",skill:"twostep-div",sim:"pipeline",opts:{},story:"x/4 + 1 = 3 wraps x in division then addition. Undo addition first (subtract 1), then undo division (multiply by 4). The pipeline shows why order matters.",example:"x/4+1=3 → x/4=2 → x=8",goals:[["undo-correct",2,"Undo 2 machines"],["slot",4,"Place 4 inverse ops"],["perfect",1,"One flawless undo"]]},
 {id:"l3",title:"Negative Results",skill:"twostep-neg",sim:"pipeline",opts:{neg:true},story:"Solutions can be negative — that is not a mistake, it is a destination. −2x + 5 = 11 undoes to x = −3. Run the pipeline below zero and verify by substitution.",example:"−2x+5=11 → −2x=6 → x=−3",goals:[["negative",1,"Undo a machine with negatives"],["undo-correct",2,"Undo 2 machines"],["perfect",1,"One flawless undo"]]},
 {id:"l4",title:"Verify & Model",skill:"twostep-word",sim:"pipeline",opts:{},story:"A taxi charges $3 plus $2 per km; a ride costs $11. That is 2k + 3 = 11. Translate the story, undo the machine, check the answer against the story. Modeling is algebra's superpower.",example:"2k+3=11 → k=4 km",goals:[["undo-correct",3,"Undo 3 machines"],["slot",6,"Place 6 inverse ops"],["perfect",1,"One flawless undo"]]}]},
{id:"w6",n:6,name:"Integer Icefall",em:"🧊",band:"Gr 7–8",flavor:"Below zero, helium balloons lift the pans. Negatives join the balance.",boss:"Below Zero",lessons:[
 {id:"l1",title:"Adding & Subtracting Integers",skill:"int-ops",sim:"hopper",opts:{mode:"add",neg:true},story:"Same trail, colder air. −5 + 3 = −2; −4 − 6 = −10. Adding a negative descends; subtracting a negative climbs (the double negative flips direction). Hop through the icefall.",example:"−4 − (−6) = −4 + 6 = 2",goals:[["hop",4,"Make 4 hops"],["land-neg",2,"Land below zero twice"],["cross-zero",2,"Cross zero twice"]]},
 {id:"l2",title:"Multiplying & Dividing Integers",skill:"int-muldiv",sim:"hopper",opts:{mode:"flip"},story:"Multiply by a negative and your direction flips: 3 × (−2) points the opposite way from 3 × 2. Two flips cancel: (−3)(−2) = +6. Use flip mode to feel the sign rule.",example:"(−3)(−2) = 6 · (−12)÷3 = −4",goals:[["flip",2,"Flip direction twice"],["hop",4,"Make 4 hops"],["land-neg",1,"Land below zero"]]},
 {id:"l3",title:"Equations with Negatives",skill:"eq-neg",sim:"balloon",opts:{},story:"Negative weights are helium balloons — they lift instead of press. x − 4 = −1 still obeys the balance rule: add 4 to both sides. Pop zero pairs to clear the pans.",example:"x − 4 = −1 → x = 3",goals:[["solve",2,"Solve 2 equations"],["op",5,"Apply 5 operations"],["negative-solve",1,"Solve one with a negative answer"]]},
 {id:"l4",title:"Zero Pairs in Equations",skill:"eq-zeropair",sim:"balloon",opts:{},story:"−x + 5 = 2 hides a negative crate. Subtract 5, then flip the sign of both sides (multiply by −1). Zero pairs — a bag plus a balloon — vanish and simplify everything.",example:"−x+5=2 → −x=−3 → x=3",goals:[["zero-pair",3,"Pop 3 zero pairs"],["solve",2,"Solve 2 equations"],["negative-solve",1,"Solve one with a negative answer"]]}]},
{id:"w7",n:7,name:"Inequality Ridge",em:"🏹",band:"Gr 7–8",flavor:"Not one answer — a whole region of them. And one rule that flips everything.",boss:"Sign Flip Showdown",lessons:[
 {id:"l1",title:"Greater Than, Less Than",skill:"ineq-read",sim:"gatekeeper",opts:{mode:"graph"},story:"x > 3 is a gate, not a point: every number past 3 passes. Test values rain from the sky — watch which ones the gate admits. An open circle means the boundary itself is excluded.",example:"x > 3: 4 passes ✓, 3 fails ✗",goals:[["catch",5,"Watch 5 values classified"],["graph-correct",2,"Graph 2 inequalities"],["graph-correct",4,"Graph 4 total"]]},
 {id:"l2",title:"Graphing Solutions",skill:"ineq-graph",sim:"gatekeeper",opts:{mode:"graph"},story:"Graphing an inequality: dot at the boundary (open for > <, closed for ≥ ≤), shade toward the solutions. Drag the dot, pick the comparator, and let the rain verify your gate.",example:"x ≤ −2: closed dot at −2, shade left",goals:[["graph-correct",3,"Graph 3 inequalities"],["catch",10,"Watch 10 values classified"],["graph-correct",5,"Graph 5 total"]]},
 {id:"l3",title:"Solving Inequalities",skill:"ineq-solve",sim:"gatekeeper",opts:{mode:"graph"},story:"Solve inequalities exactly like equations — add, subtract, multiply, divide both sides — with one exception lurking in the next lesson. For now, isolate x and graph the region.",example:"x + 2 > 5 → x > 3",goals:[["graph-correct",3,"Graph 3 inequalities"],["catch",6,"Watch 6 values classified"],["flip",1,"Trigger the flip (switch mode)"]]},
 {id:"l4",title:"The Flip Rule",skill:"ineq-flip",sim:"gatekeeper",opts:{mode:"flip"},story:"Multiply or divide an inequality by a NEGATIVE and the sign flips: −2x < 6 becomes x > −3. Why? Multiplying by −1 mirrors the number line — left and right swap. Drag the scale factor below zero and watch the gate flip.",example:"−2x < 6 → x > −3 (flip!)",goals:[["flip",2,"Trigger the flip twice"],["graph-correct",1,"Graph one inequality"],["catch",5,"Watch 5 values classified"]]}]},
{id:"w8",n:8,name:"Graph Glacier",em:"🛷",band:"Gr 8",flavor:"Patterns become tables, tables become lines, lines become y = mx + b.",boss:"Read the Mountain",lessons:[

 {id:"l2",title:"Tables of Values",skill:"tables",sim:"grower",opts:{table:true},story:"A table pairs each input with its output. Equal steps in x give equal steps in y — that constant change is the rate. Read the table forward and backward to find missing values.",example:"x:0→2, 1→5, 2→8 ⇒ y = 3x + 2",goals:[["predict-correct",2,"Make 2 predictions"],["scrub10",1,"Scrub to step 10"],["rule-reveal",1,"Reveal the rule"]]},
 {id:"l3",title:"Slope as Rate",skill:"slope",sim:"sledder",opts:{},story:"Slope is rise over run: how steeply the sled climbs. m = 2 means up 2 for every 1 across. Negative slope descends. Drag m and feel the mountain change steepness.",example:"(1,2)→(3,6): m = (6−2)/(3−1) = 2",goals:[["point-hit",2,"Pass through 2 target points"],["match",1,"Build a target line"],["match",2,"Build 2 target lines"]]},
 {id:"l4",title:"y = mx + b",skill:"linear",sim:"sledder",opts:{},story:"m is the slope, b is where the line crosses the y-axis — the starting height. Together they define every straight line in the universe. Toggle a second line and find where two paths cross.",example:"y = 2x − 3: slope 2, crosses y-axis at −3",goals:[["match",2,"Build 2 target lines"],["point-hit",2,"Hit 2 target points"],["intersection-found",1,"Find where two lines cross"]]}]},
{id:"w9",n:9,name:"Hero Peak",em:"🏔",band:"Gr 8 → 9 bonus",flavor:"The summit gauntlet: both-sides variables, modeling, and crossing lines.",boss:"Zero → Hero",lessons:[
 {id:"l1",title:"Variables on Both Sides",skill:"both-sides",sim:"balance",opts:{bothSides:true},story:"5x + 2 = 3x + 8: crates on both pans. Remove 3x from BOTH sides first — the beam stays level — then solve the two-step that remains. Heroes collect the variables on one side.",example:"5x+2=3x+8 → 2x+2=8 → 2x=6 → x=3",goals:[["solve",2,"Solve 2 equations"],["op",6,"Apply 6 operations"],["tilt",1,"See an imbalance"]]},
 {id:"l2",title:"Word Problem Modeling",skill:"modeling",sim:"pipeline",opts:{},story:"Read the story, name the unknown x, build the equation, undo the machine, check against the story. Five moves, every time. This is the skill that makes algebra useful everywhere.",example:"Tickets $5 + $2/ride, spent $17: 2r+5=17 → r=6",goals:[["undo-correct",3,"Undo 3 machines"],["perfect",2,"Two flawless undos"],["slot",6,"Place 6 inverse ops"]]},

/* ============ GENERATORS ============ */
const GEN={};
function nI(prompt,answer,explain,hints){return{type:"num",prompt,answer,explain,hints};}
function cI(prompt,choices,correct,explain,hints,r){const idx=shuffle(r,choices.map((c,i)=>i));return{type:"choice",prompt,choices:idx.map(i=>choices[i]),answer:idx.indexOf(correct),explain,hints};}
function sI(prompt,steps,explain,hints){return{type:"steps",prompt,steps,explain,hints};}
const H3=(a,b,c)=>[a,b,c];
GEN["int-add"]=r=>{const a=ri(r,-9,9),b=ri(r,-9,9);return nI(M(a+" + ("+b+")"),a+b,M(a+" + ("+b+") = "+(a+b)),H3("Start at "+M(a)+" on the number line.","Adding "+M(b)+" means hop "+Math.abs(b)+" "+(b>=0?"right":"left")+".","Count from "+M(a)+": the landing is "+M(a+b)+"."));};
GEN["int-sub"]=r=>{const a=ri(r,-9,9),b=ri(r,-9,9);return nI(M(a+" − ("+b+")"),a-b,M(a+" − ("+b+") = "+a+" + "+M(-b)+" = "+(a-b)),H3("Subtracting is adding the opposite.","Rewrite as "+M(a+" + ("+(-b)+")".replace("(-","(").replace(")",""))+".","Hop "+Math.abs(b)+" "+(b>=0?"left":"right")+" from "+M(a)+" → "+M(a-b)+"."));};
GEN.pemdas=r=>{const a=ri(r,2,9),b=ri(r,2,6),c=ri(r,1,9),br=r()<0.5;const expr=br?"("+a+" + "+c+") × "+b:a+" + "+c+" × "+b;const ans=br?(a+c)*b:a+c*b;return nI(M(expr),ans,M(expr)+" = "+ans,H3("Brackets first, then × ÷, then + −.","Do "+(br?"("+a+" + "+c+") = "+(a+c):c+" × "+b+" = "+c*b)+" first.","Then "+(br?(a+c)+" × "+b:a+" + "+c*b)+" = "+ans+"."));};
GEN.evaluate=r=>{const a=ri(r,2,6),b=ri(r,-6,9),x=ri(r,-4,6);return nI("If x = "+M(x)+", what is "+M(a+"x "+(b<0?"− "+(-b):"+ "+b))+"?",a*x+b,M(a+"("+x+") "+(b<0?"− "+(-b):"+ "+b)+" = "+(a*x+b)),H3("Replace every x with "+M(x)+".","Multiply first: "+a+" × "+M(x)+" = "+M(a*x)+".","Then "+M(a*x+" "+(b<0?"− "+(-b):"+ "+b))+" = "+M(a*x+b)+"."));};
GEN.rules=r=>{const a=ri(r,2,5),b=ri(r,-4,6),q=ri(r,6,12);const rows=[1,2,3].map(x=>"<tr><td>"+x+"</td><td>"+M(a*x+b)+"</td></tr>").join("");const rule="y = "+a+"x "+(b<0?"− "+(-b):"+ "+b);const opts=[rule,"y = "+(a+1)+"x "+(b<0?"− "+(-b):"+ "+b),"y = "+a+"x "+(b+1<0?"− "+(-(b+1)):"+ "+(b+1)),"y = "+b+"x + "+a];return cI("Which rule fits this table?<table><tr><th>x</th><th>y</th></tr>"+rows+"</table>",opts,0,rule+" fits every row.",H3("How much does y change when x grows by 1?","The change is "+a+" — that is the multiplier.","Check x=1: "+a+"×1 "+(b<0?"−"+(-b):"+"+b)+" = "+M(a+b)+" ✓"),r);};
GEN.translate=r=>{const n=ri(r,2,9),m=ri(r,2,5);const T=[["a number increased by "+n,"x + "+n,["x − "+n,n+" − x",n+"x"]],[""+n+" less than a number","x − "+n,[n+" − x","x + "+n,"−"+n+"x"]],["the product of "+m+" and a number",m+"x",[m+" + x","x/"+m,"x − "+m]],["a number divided by "+m,"x/"+m,[m+"/x",m+"x","x − "+m]],[""+n+" more than twice a number","2x + "+n,["2(x + "+n+")","2x − "+n,n+"x + 2"]],["twice the sum of a number and "+n,"2(x + "+n+")",["2x + "+n,"x + 2"+n,"2x − "+n]]];const t=pick(r,T);return cI("Translate: “"+t[0]+"”",[t[1],...t[2]],0,t[0]+" → "+t[1],H3("Let the unknown number be x.","'Less than' reverses the order; 'product' means ×.","The expression is "+t[1]+"."),r);};
GEN.parts=r=>{const a=ri(r,2,9),b=ri(r,1,9);const kind=pick(r,["coefficient","constant","variable"]);const ans=kind==="coefficient"?String(a):kind==="constant"?String(b):"x";return cI("In "+M(a+"x + "+b)+", what is the "+kind+"?",[ans,kind==="coefficient"?String(b):String(a),"x",a+"x"],0,"The "+kind+" is "+ans+".",H3("Coefficient = number multiplying x.","Constant = the number alone.","Variable = the letter."),r);};
GEN.tiles=r=>{const cx=ri(r,-3,4)||2,cu=ri(r,-4,5);const expr=(cx===1?"x":cx===-1?"−x":M(cx+"x"))+(cu===0?"":cu>0?" + "+cu:" − "+(-cu));const d1=(cx+1===1?"x":M((cx+1)+"x"))+(cu>0?" + "+cu:" − "+(-cu||1));const d2=M(cx+"x")+(cu>=0?" − "+(cu||1):" + "+(-cu));const d3=M(-cx+"x")+(cu>0?" + "+cu:"");return cI("A bench holds "+(cx>=0?cx+" positive":(-cx)+" negative")+" x-tiles and "+(cu>=0?cu+" positive":(-cu)+" negative")+" unit tiles. Which expression?",[expr,d1,d2,d3],0,expr,H3("x-tiles give the x-term; units give the constant.","Negative tiles subtract.","Count: "+M(cx)+" x's and "+M(cu)+" units."),r);};
GEN["like-terms"]=r=>{const a=ri(r,1,6),c=ri(r,1,6),b=ri(r,-6,9),d=ri(r,-6,9);const prompt=M(a+"x "+(b<0?"− "+(-b):"+ "+b)+" + "+c+"x "+(d<0?"− "+(-d):"+ "+d));const ans=(a+c)+"x "+(b+d<0?"− "+(-(b+d)):"+ "+(b+d));return cI("Simplify: "+prompt,[ans,(a+c)+"x "+(b+d+1<0?"− "+(-(b+d+1)):"+ "+(b+d+1)),(a+c+1)+"x "+(b+d<0?"− "+(-(b+d)):"+ "+(b+d)),M((a+c)+"x")],0,prompt+" = "+ans,H3("Group the x-terms and the constants separately.",a+"x + "+c+"x = "+(a+c)+"x.","Constants: "+M(b+" "+(d<0?"− "+(-d):"+ "+d))+" = "+M(b+d)+"."),r);};
GEN.distribute=r=>{const a=ri(r,2,6),b=ri(r,2,5),c=ri(r,-6,9);const prompt=M(a+"("+b+"x "+(c<0?"− "+(-c):"+ "+c)+")");const ans=M(a*b+"x "+(a*c<0?"− "+(-a*c):"+ "+a*c));return cI("Expand: "+prompt,[ans,M(a*b+"x "+(c<0?"− "+(-c):"+ "+c)),M(a*b+"x "+(a*c+1<0?"− "+(-(a*c+1)):"+ "+(a*c+1))),M((a+b)+"x "+(a*c<0?"− "+(-a*c):"+ "+a*c))],0,prompt+" = "+ans,H3("Multiply a by EACH term inside.",""+a+" × "+b+"x = "+a*b+"x.",""+a+" × "+M(c)+" = "+M(a*c)+"."),r);};
GEN.simplify=r=>{const a=ri(r,2,4),b=ri(r,1,6),c=ri(r,1,5);const prompt=M(a+"(x + "+b+") + "+c+"x");const ans=(a+c)+"x + "+a*b;return cI("Expand and simplify: "+prompt,[ans,(a+c)+"x + "+b,a+"x + "+(a*b+c),(a+c+1)+"x + "+a*b],0,prompt+" = "+a+"x + "+a*b+" + "+c+"x = "+ans,H3("Distribute first: "+a+"x + "+a*b+".","Then combine x-terms: "+a+"x + "+c+"x.","= "+(a+c)+"x + "+a*b+"."),r);};

SIMS.translator=(scope,api,opts)=>{const P={set:opts.set||"mixed",diff:1,hints:false,reveal:false,auto:true};

svg.append(s("circle",{cx:X(d.v),cy:d.y,r:13,fill:"#242D52",stroke:col,"stroke-width":2.5}),stxt(X(d.v),d.y+5,M(d.v),{"text-anchor":"middle","font-size":12,"font-weight":800,fill:col},svg));});

scope.raf(()=>{let changed=false;drops.forEach(d=>{if(d.state==="fall"){d.y+=2.2*P.rainSpeed;if(d.y>=LY-14){const g2=currentGraph();const ok=satisfies(d.v,P.mode==="graph"?card.b:g2.b,P.mode==="graph"?card.cmp:g2.cmp);d.state=ok?"pass":"bounce";correctCount++;api.emit("catch");if(ok)AU.play("click");changed=true;}}

{t:"toggle",label:"Hint line",get:()=>P.hints,set:v=>P.hints=v},
